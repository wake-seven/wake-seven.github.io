<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>だるまさんを起こして！</title>
  <style>
    /* ページ全体の見た目 */
    :root { --ai:#16283c; --ai2:#1f3752; --washi:#f7eedc; --washi2:#bccdd3; --kin:#c9a54e; --content-max:23.25rem; }
    html { font-size:calc(16px * clamp(1,calc(100vw / 570px),1.5)); max-width:100%; overflow-x:hidden; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; max-width:100%; display:flex; flex-direction:column; align-items:center; padding:1.125rem 0.75rem max(0.75rem,env(safe-area-inset-bottom)); background:var(--ai); background-image:radial-gradient(120% 70% at 50% 0%,var(--ai2) 0%,var(--ai) 62%); color:var(--washi); font-family:"A1 Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif; }
    /* 画面の枠 */
    .w7-shell { width:100%; max-width:var(--content-max); }
    .w7-app-title { margin:0 0 .35rem; text-align:center; font-size:clamp(1.25rem,5vw,1.65rem); }
    .w7-stage-label { margin:0 0 .8rem; text-align:center; color:#b9e8f2; font-weight:700; }
    /* 盤面、棒、操作ボタン */
    .w7-board-feature { display:grid; gap:0.625rem; }
    .w7-board-status { display:flex; justify-content:center; gap:1.5rem; min-height:1.75rem; font-weight:700; font-size:1.05rem; font-variant-numeric:tabular-nums; }
    .w7-board-status strong { display:inline-block; min-width:1.25ch; text-align:right; color:#f5d66d; font-size:1.2em; }
    .w7-board-frame { position:relative; width:100%; max-width:var(--content-max); margin:0 auto; }
    .w7-board { display:block; width:100%; height:auto; overflow:visible; touch-action:none; user-select:none; -webkit-user-select:none; cursor:default; }
    .w7-cell { transform-box:view-box; transform-origin:0 0; will-change:transform; transition:opacity .12s ease,filter .12s ease; }
    .w7-cell-hex { fill:var(--washi); stroke:#c0ac88; stroke-width:1.5; }
    .w7-cell--fallen .w7-cell-hex { fill:var(--washi2); stroke:#c0ac88; }
    .w7-cell--standing { filter:brightness(1.04); }
    /* Daruma artwork is authored around local (0,0), the same center as its panel. */
    .w7-daruma { transform-origin:0 0; }
    .w7-axis-pivot { fill:var(--kin); opacity:.72; pointer-events:none; }
    .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; stroke-width:1.25; pointer-events:none; filter:drop-shadow(0 1px 1px rgb(0 0 0 / .25)); }
    .w7-board.is-grip-hover { cursor:grab; }
    .w7-board[data-phase="dragging"] { cursor:grabbing; }
    /* 棒はつかんで回転している間と、全員が起きた後には表示しない。 */
    .w7-board:not([data-phase="ready"]) .w7-axis-layer { opacity:0; }
    .w7-board[data-solved="true"] .w7-axis-layer { opacity:0; }
    .w7-board.is-invalid-grab .w7-cell { opacity:.28; filter:saturate(.55) brightness(.62); }
    .w7-board.is-invalid-grab .w7-axis-pivot { opacity:.18; }
    .w7-grip-prompt { position:absolute; z-index:2; inset:0; display:grid; place-items:center; pointer-events:none; padding:2.5rem 1.25rem; text-align:center; }
    .w7-grip-prompt[hidden] { display:none; }
    .w7-grip-prompt span { display:block; padding:.6rem .8rem; border:1px solid rgb(98 215 244 / .66); border-radius:.4rem; background:rgb(22 40 60 / .86); color:#b9e8f2; font-size:clamp(1rem,4vw,1.25rem); font-weight:800; line-height:1.35; box-shadow:0 4px 18px rgb(0 0 0 / .28); }
    .w7-board-controls { display:flex; justify-content:center; gap:0.75rem; }
    .w7-board-button { min-width:7rem; min-height:2.75rem; border:1px solid #c0ac88; border-radius:999px; padding:0.55rem 1rem; background:var(--washi); color:#2d2925; font:inherit; font-weight:700; box-shadow:0 2px 0 rgb(0 0 0 / .24); cursor:pointer; }
    .w7-board-button:focus-visible { outline:3px solid #7dd8f5; outline-offset:3px; }
    .w7-board-button:disabled { opacity:.42; cursor:default; box-shadow:none; }
    .w7-clear-burst { pointer-events:none; transform-box:view-box; }
    .w7-dialog-backdrop { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:1rem; background:rgb(5 14 25 / .64); }
    .w7-dialog-backdrop[hidden] { display:none; }
    .w7-dialog { width:min(100%,22rem); border:2px solid #7dd8f5; border-radius:1rem; padding:1.35rem; background:var(--ai2); color:var(--washi); box-shadow:0 1rem 3rem rgb(0 0 0 / .42); text-align:center; }
    .w7-dialog h2 { margin:0 0 .6rem; font-size:1.55rem; }
    .w7-dialog p { margin:.3rem 0 1rem; line-height:1.55; }
    .w7-dialog-actions { display:flex; justify-content:center; gap:.65rem; flex-wrap:wrap; }
    @media (prefers-reduced-motion:reduce) { .w7-board * { animation:none!important; transition:none!important; } }
    /* スマホでは盤面を横いっぱいに使う */
    @media (max-width:480px) { body { padding-left:0.25rem; padding-right:0.25rem; padding-bottom:max(0.5rem,env(safe-area-inset-bottom)); } .w7-shell,.w7-board-frame { max-width:none; } }
  </style>
</head>
<body>
  <!-- 盤面の画面 -->
  <main class="w7-shell">
    <h1 class="w7-app-title">だるまさんを起こして！</h1>
    <p id="w7-stage-label" class="w7-stage-label">通常問題 1 / 2</p>
    <section class="w7-board-feature" aria-label="七枚のだるま盤">
      <div class="w7-board-status" aria-live="polite">
        <span>いま <strong id="w7-board-moves">0</strong> くるり</span>
        <span>あと <strong id="w7-board-remaining">1</strong> くるり</span>
      </div>
      <div class="w7-board-frame">
        <svg id="w7-board" class="w7-board" viewBox="14 0 293 310" role="img" aria-label="七枚のだるま盤"></svg>
        <div id="w7-grip-prompt" class="w7-grip-prompt" hidden><span>水色の棒をつかんで回そう</span></div>
      </div>
      <div class="w7-board-controls" aria-label="盤面の操作">
        <button id="w7-board-undo" class="w7-board-button" type="button" data-w7-action="undo">一手戻す</button>
        <button id="w7-board-restart" class="w7-board-button" type="button" data-w7-action="restart">やり直す</button>
      </div>
    </section>
  </main>
  <div id="w7-dialog-backdrop" class="w7-dialog-backdrop" hidden>
    <section id="w7-dialog" class="w7-dialog" role="dialog" aria-modal="true" aria-labelledby="w7-dialog-title" tabindex="-1"></section>
  </div>
  <!-- だるまのSVG部品。盤面描画からuseして使う。 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="w7-daruma-body">
      <path d="M0 -34C17 -34 31 -18 31 4C31 24 18 36 0 36C-18 36 -31 24 -31 4C-31 -18 -17 -34 0 -34Z" fill="var(--daruma-body, #C8352C)"/>
      <path d="M0 -34C17 -34 31 -18 31 4C31 24 18 36 0 36C-18 36 -31 24 -31 4C-31 -18 -17 -34 0 -34Z" fill="none" stroke="#241D1A" stroke-width="2.4"/>
      <ellipse cx="0" cy="-6" rx="19" ry="18" fill="#F3E8D5" stroke="#241D1A" stroke-width="1.9"/>
      <path d="M-15 22C-8 28 8 28 15 22" stroke="var(--daruma-accent, #C9A54E)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
    <g id="w7-face-open">
      <path d="M-13 -14C-11 -17 -6 -17 -4 -14M4 -14C6 -17 11 -17 13 -14" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="-8" cy="-5" r="3.7" fill="#241D1A"/><circle cx="8" cy="-5" r="3.7" fill="#241D1A"/>
      <circle cx="-9.2" cy="-6.2" r="1.2" fill="#F3E8D5"/><circle cx="6.8" cy="-6.2" r="1.2" fill="#F3E8D5"/>
      <circle cx="-15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/><circle cx="15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/>
      <path d="M-5 5C-3 8 3 8 5 5" stroke="#241D1A" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <g id="w7-face-shut">
      <path d="M-13 -13C-11 -15 -6 -15 -4 -13M4 -13C6 -15 11 -15 13 -13" stroke="#241D1A" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".7"/>
      <path d="M-13 -5C-11 -1 -5 -1 -3 -5M3 -5C5 -1 11 -1 13 -5" stroke="#241D1A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <circle cx="-15" cy="3" r="4.4" fill="#E2897B" opacity=".32"/><circle cx="15" cy="3" r="4.4" fill="#E2897B" opacity=".32"/>
      <ellipse cx="0" cy="6" rx="3" ry="2.3" fill="#241D1A" opacity=".75"/>
    </g>
    <g id="w7-face-happy">
      <path d="M-13 -14C-11 -17 -6 -17 -4 -14" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M4 -14C6 -17 11 -17 13 -14" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M-13 -4Q-8 -11 -3 -4" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M3 -4Q8 -11 13 -4" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="-15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/><circle cx="15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/>
      <path d="M-5 5C-3 8 3 8 5 5" stroke="#241D1A" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </defs></svg>

  <script type="module">
    /*
      将来の改修では、依頼に出てくる自然な言葉から近い処理を見つけられることを優先する。
      説明コメント、状態、描画、入力、検査は、それぞれが必要になる場所の近くに置く。
      検索のためだけの記号、空の雛形、汎用化だけを目的にした層は増やさない。
    */

    // 盤面の定数と、いま表示する問題
    const CELL_COUNT = 7;
    const CELL_RADIUS = 54;
    const CELL_SPACING_X = Math.sqrt(3) * CELL_RADIUS;
    const CELL_SPACING_Y = 1.5 * CELL_RADIUS;
    const BOARD_ORIGIN = Object.freeze({ x: 66.77, y: 74 });
    const CELL_LAYOUT = Object.freeze([[.5, 0], [1.5, 0], [0, 1], [1, 1], [2, 1], [.5, 2], [1.5, 2]]);
    const CELL_POSITIONS = Object.freeze(CELL_LAYOUT.map(([column, row]) => Object.freeze({
      x: BOARD_ORIGIN.x + column * CELL_SPACING_X,
      y: BOARD_ORIGIN.y + row * CELL_SPACING_Y,
    })));
    const SOLVED_BOARD = Object.freeze([0, 0, 0, 0, 0, 0, 0]);
    const EXPECTED_DISTANCE_DISTRIBUTION = Object.freeze([1, 12, 102, 402, 212]);
    const TURN_DEGREES = 120;
    const DARUMA_UPRIGHT_WINDOW_DEGREES = 22;
    const DRAG_COMMIT_DEGREES = 60;
    const QUICK_FLICK_DEGREES = 18;
    const QUICK_FLICK_MILLISECONDS = 320;
    const ROTATION_MIN_MILLISECONDS = 190;
    const ROTATION_MAX_MILLISECONDS = 620;
    const ROTATION_MILLISECONDS_PER_DEGREE = 4.65;
    const UNDO_MILLISECONDS = 420;
    const ARRIVAL_MILLISECONDS = 420;
    const RESTART_MILLISECONDS = 280;
    const CLEAR_MILLISECONDS = 720;
    // 最後のだるまの弾みが終わってから出すダイアログを、はっきり早める間隔。
    const CLEAR_TILE_STAGGER_MILLISECONDS = 25;
    const CLEAR_SETTLE_MILLISECONDS = CLEAR_MILLISECONDS + (CELL_COUNT - 1) * CLEAR_TILE_STAGGER_MILLISECONDS;
    // 棒をつかめる範囲。innerは盤面中心側、outerは外周側、acrossは棒の左右方向。
    // 中央盤面までは広げず、外へ伸ばすより棒の左右を広くする。
    const GRIP_HIT_RANGE = Object.freeze({ inner:28, outer:24, across:40 });
    // 現行index.htmlのステージ1を、いまの盤面表示・操作・自己検査の基準にする。
    const REFERENCE_STAGE = Object.freeze({ puzzleId:'stage-001', state:31, par:1 });
    // 七枚の向きと、三枚を120度回す盤面ルール
    function makeTriangles(cellPositions) {
      const isNeighbor = (a, b) => Math.abs(Math.hypot(a.x - b.x, a.y - b.y) - CELL_SPACING_X) < 2;
      const triangles = [];
      for (let a = 0; a < CELL_COUNT; a += 1) for (let b = a + 1; b < CELL_COUNT; b += 1) for (let c = b + 1; c < CELL_COUNT; c += 1) {
        if (!isNeighbor(cellPositions[a], cellPositions[b]) || !isNeighbor(cellPositions[b], cellPositions[c]) || !isNeighbor(cellPositions[a], cellPositions[c])) continue;
        const x = (cellPositions[a].x + cellPositions[b].x + cellPositions[c].x) / 3;
        const y = (cellPositions[a].y + cellPositions[b].y + cellPositions[c].y) / 3;
        const cells = [a, b, c].sort((left, right) => Math.atan2(cellPositions[left].y - y, cellPositions[left].x - x) - Math.atan2(cellPositions[right].y - y, cellPositions[right].x - x));
        triangles.push(Object.freeze({ cells: Object.freeze(cells), x, y }));
      }
      return Object.freeze(triangles);
    }

    const TRIANGLES = makeTriangles(CELL_POSITIONS);
    const EXPECTED_AXES = Object.freeze([
      Object.freeze({ cells:'0,1,3', pivot:Object.freeze([160.3007,101]), grip:Object.freeze([160.3007,69]) }),
      Object.freeze({ cells:'0,3,2', pivot:Object.freeze([113.5354,128]), grip:Object.freeze([85.8226,112]) }),
      Object.freeze({ cells:'1,4,3', pivot:Object.freeze([207.0661,128]), grip:Object.freeze([234.7789,112]) }),
      Object.freeze({ cells:'2,3,5', pivot:Object.freeze([113.5354,182]), grip:Object.freeze([85.8226,198]) }),
      Object.freeze({ cells:'3,4,6', pivot:Object.freeze([207.0661,182]), grip:Object.freeze([234.7789,198]) }),
      Object.freeze({ cells:'3,6,5', pivot:Object.freeze([160.3007,209]), grip:Object.freeze([160.3007,241]) }),
    ]);
    function axisGeometry(triangle) {
      const center = CELL_POSITIONS[3];
      const angle = Math.atan2(triangle.y - center.y, triangle.x - center.x);
      return Object.freeze({ pivot:Object.freeze([triangle.x, triangle.y]), grip:Object.freeze([triangle.x + 32 * Math.cos(angle), triangle.y + 32 * Math.sin(angle)]), angle });
    }

    const WakeSevenBoardDomain = Object.freeze({
      cellCount: CELL_COUNT,
      stateCount: 3 ** CELL_COUNT,
      triangles: TRIANGLES,
      encode(cells) {
        let state = 0;
        for (let index = 0; index < CELL_COUNT; index += 1) state += cells[index] * 3 ** index;
        return state;
      },
      decode(state) {
        const cells = new Uint8Array(CELL_COUNT);
        let remaining = state;
        for (let index = 0; index < CELL_COUNT; index += 1) { cells[index] = remaining % 3; remaining = Math.floor(remaining / 3); }
        return cells;
      },
      roll(cells, triangleIndex, direction) {
        if (direction !== 1 && direction !== -1) throw new RangeError('roll direction must be +1 or -1');
        const next = Uint8Array.from(cells);
        const triangle = TRIANGLES[triangleIndex];
        if (!triangle) throw new RangeError('unknown triangle');
        for (let offset = 0; offset < 3; offset += 1) {
          const from = direction > 0 ? triangle.cells[offset] : triangle.cells[(offset + 1) % 3];
          const to = direction > 0 ? triangle.cells[(offset + 1) % 3] : triangle.cells[offset];
          next[to] = (cells[from] + (direction > 0 ? 1 : 2)) % 3;
        }
        return next;
      },
      isSolved(cells) { return Array.from(cells).every(value => value === 0); },
      buildSolver() {
        const distance = new Uint8Array(3 ** CELL_COUNT).fill(255);
        const byDepth = [];
        let frontier = [0];
        distance[0] = 0;
        byDepth.push(frontier);
        let depth = 0;
        while (frontier.length) {
          const next = [];
          for (const state of frontier) {
            const cells = this.decode(state);
            for (let triangleIndex = 0; triangleIndex < TRIANGLES.length; triangleIndex += 1) for (const direction of [1, -1]) {
              const nextState = this.encode(this.roll(cells, triangleIndex, direction));
              if (distance[nextState] === 255) { distance[nextState] = depth + 1; next.push(nextState); }
            }
          }
          if (next.length) byDepth.push(next);
          frontier = next;
          depth += 1;
        }
        return Object.freeze({ distance, byDepth: Object.freeze(byDepth.map(states => Object.freeze(states))) });
      },
    });
    const SOLVER = WakeSevenBoardDomain.buildSolver();
    const INITIAL_BOARD = Object.freeze(Array.from(WakeSevenBoardDomain.decode(REFERENCE_STAGE.state)));
    // P3で扱う通常問題は二問だけ。問題を増やす時も、盤面状態と最短手数はこのカタログに集める。
    const NORMAL_PUZZLES = Object.freeze([
      Object.freeze({ puzzleId:'stage-001', state:31, par:1 }),
      Object.freeze({ puzzleId:'stage-002', state:1732, par:2 }),
    ]);
    const APP_STORAGE_KEY = 'wake7-rebuild-v1';
    const APP_SCHEMA_VERSION = 1;
    const APP_CATALOG_VERSION = 1;
    // 画面上の見た目だけを変える座標変換。盤面ルールや履歴は変えない。
    /* The board's logic always uses CELL_POSITIONS; this display transform is presentation-only. */
    const BOARD_VIEW = Object.freeze({ rotationDegrees: 0, translateX: 0, translateY: 0 });
    function viewPoint(logicalPoint) {
      const center = CELL_POSITIONS[3];
      const radians = BOARD_VIEW.rotationDegrees * Math.PI / 180;
      const dx = logicalPoint.x - center.x;
      const dy = logicalPoint.y - center.y;
      return Object.freeze({ x: center.x + dx * Math.cos(radians) - dy * Math.sin(radians) + BOARD_VIEW.translateX, y: center.y + dx * Math.sin(radians) + dy * Math.cos(radians) + BOARD_VIEW.translateY });
    }

    // These are logical symmetry transforms, kept separate from the presentation-only BOARD_VIEW above.
    function makeViewPermutation(rotationDegrees = 0, flip = false) {
      const center = CELL_POSITIONS[3];
      const radians = rotationDegrees * Math.PI / 180;
      return Object.freeze(CELL_POSITIONS.map(point => {
        let x = point.x - center.x;
        const y = point.y - center.y;
        if (flip) x = -x;
        const rotated = { x: center.x + x * Math.cos(radians) - y * Math.sin(radians), y: center.y + x * Math.sin(radians) + y * Math.cos(radians) };
        return CELL_POSITIONS.reduce((bestIndex, candidate, index) => Math.hypot(candidate.x - rotated.x, candidate.y - rotated.y) < Math.hypot(CELL_POSITIONS[bestIndex].x - rotated.x, CELL_POSITIONS[bestIndex].y - rotated.y) ? index : bestIndex, 0);
      }));
    }
    const VIEW_SYMMETRIES = Object.freeze(Array.from({ length: 6 }, (_, turn) => Object.freeze([
      Object.freeze({ permutation: makeViewPermutation(turn * 60), flip: false }),
      Object.freeze({ permutation: makeViewPermutation(turn * 60, true), flip: true }),
    ])).flat());
    function transformCellsBySymmetry(cells, symmetry) {
      const transformed = new Uint8Array(CELL_COUNT);
      for (let from = 0; from < CELL_COUNT; from += 1) transformed[symmetry.permutation[from]] = symmetry.flip ? (3 - cells[from]) % 3 : cells[from];
      return transformed;
    }
    // 盤面、だるま、六本の棒をSVGへ描く
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const boardElement = document.querySelector('#w7-board');
    const boardMovesElement = document.querySelector('#w7-board-moves');
    const boardRemainingElement = document.querySelector('#w7-board-remaining');
    const boardUndoButton = document.querySelector('#w7-board-undo');
    const boardRestartButton = document.querySelector('#w7-board-restart');
    const boardGripPrompt = document.querySelector('#w7-grip-prompt');
    const stageLabelElement = document.querySelector('#w7-stage-label');
    const dialogBackdropElement = document.querySelector('#w7-dialog-backdrop');
    const dialogElement = document.querySelector('#w7-dialog');
    function svgElement(name, attributes = {}) { const element = document.createElementNS(SVG_NS, name); for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value)); return element; }
    function hexPath(radius) { return Array.from({ length: 6 }, (_, index) => { const angle = (90 + index * 60) * Math.PI / 180; return `${index ? 'L' : 'M'}${(radius * Math.cos(angle)).toFixed(2)} ${(radius * -Math.sin(angle)).toFixed(2)}`; }).join(' ') + 'Z'; }
    function orientationDegrees(orientation) { return orientation === 0 ? 0 : orientation === 1 ? TURN_DEGREES : -TURN_DEGREES; }
    function appendDaruma(parent, orientation, happy = false) {
      const group = svgElement('g', { class: 'w7-daruma', transform: `rotate(${orientationDegrees(orientation)})`, 'data-orientation': orientation });
      group.append(svgElement('use', { href: '#w7-daruma-body' }));
      group.append(svgElement('use', { href: happy && orientation === 0 ? '#w7-face-happy' : orientation === 0 ? '#w7-face-open' : '#w7-face-shut' }));
      parent.append(group);
    }
    function appendAxisLayer(target) {
      const layer = svgElement('g', { class: 'w7-axis-layer', 'aria-hidden': 'true' });
      TRIANGLES.forEach((triangle, triangleIndex) => {
        const geometry = axisGeometry(triangle);
        const pivot = viewPoint({ x:geometry.pivot[0], y:geometry.pivot[1] });
        const grip = viewPoint({ x:geometry.grip[0], y:geometry.grip[1] });
        layer.append(svgElement('circle', { class:'w7-axis-pivot', cx:pivot.x, cy:pivot.y, r:4.4, 'data-axis':triangleIndex }));

        const afterNext = makeNextPuzzleAppState(restoredClear);
        checkRuntime('next-puzzle-reload', afterNext.navigation.puzzleId === puzzleAt(1).puzzleId && sameCells(afterNext.board.cells, puzzleInitialCells(puzzleAt(1))) && afterNext.board.history.length === 0 && !afterNext.board.clearCommitted && afterNext.ui.dialog === null && afterNext.progress.normalCompleted.includes(firstPuzzle.puzzleId), 'next puzzle did not preserve progress and reset its board');
        const preservedProgress = puzzleAt(1).puzzleId;
        const brokenBoard = normalizePersistentAppState({ ...savedClear, board:{ ...savedClear.board, cells:[9, 9, 9] }, progress:{ normalCompleted:[preservedProgress] }, rewards:{ masterGoldGranted:true, satoriDesignGranted:false }, settings:{ theme:'gold', layout:'satori-tilted' } });
        checkRuntime('broken-board-keeps-independent-state', sameCells(brokenBoard.board.cells, initial) && brokenBoard.progress.normalCompleted.includes(preservedProgress) && brokenBoard.settings.theme === 'gold' && brokenBoard.settings.layout === 'standard', 'broken board fallback changed independent progress or reward settings');
      }
      const lockedRewardSettings = normalizePersistentAppState({ ...makeDefaultAppState(), settings:{ theme:'gold', layout:'satori-tilted', themeChosen:true, layoutChosen:true } });
      checkRuntime('locked-reward-selection-fallback', lockedRewardSettings.settings.theme === 'standard' && lockedRewardSettings.settings.layout === 'standard', 'locked reward selection was not normalized');
      const zeroMoveRestore = normalizePersistentAppState(makeDefaultAppState());
      checkRuntime('zero-move-reload', zeroMoveRestore.board.history.length === 0 && sameCells(zeroMoveRestore.board.cells, puzzleInitialCells(puzzleAt(0))), 'zero-move reload changed the board');
      const secondPuzzle = puzzleAt(1);
      const secondInitial = puzzleInitialCells(secondPuzzle);
      const possibleMoves = TRIANGLES.flatMap((_, triangleIndex) => [1, -1].map(direction => ({ triangleIndex, direction })));
      const twoMoveSolution = possibleMoves.flatMap(firstMove => {
        const afterFirst = WakeSevenBoardDomain.roll(secondInitial, firstMove.triangleIndex, firstMove.direction);
        return possibleMoves.map(secondMove => ({ firstMove, secondMove, afterFirst, afterSecond:WakeSevenBoardDomain.roll(afterFirst, secondMove.triangleIndex, secondMove.direction) }));
      }).find(candidate => WakeSevenBoardDomain.isSolved(candidate.afterSecond));
      if (!twoMoveSolution) errors.push('second P3 puzzle has no two-move solution');
      else {
        const afterOneMove = Array.from(twoMoveSolution.afterFirst);
        const afterTwoMoves = Array.from(twoMoveSolution.afterSecond);
        const firstHistoryEntry = { triangleIndex:twoMoveSolution.firstMove.triangleIndex, direction:twoMoveSolution.firstMove.direction, before:[...secondInitial], after:afterOneMove };
        const secondHistoryEntry = { triangleIndex:twoMoveSolution.secondMove.triangleIndex, direction:twoMoveSolution.secondMove.direction, before:afterOneMove, after:afterTwoMoves };
        const twoMoveStage = makeDefaultAppState(1);
        twoMoveStage.board = { initialCells:[...secondInitial], cells:afterTwoMoves, history:[firstHistoryEntry, secondHistoryEntry], clearCommitted:false };
        const restoredTwoMove = normalizePersistentAppState(twoMoveStage);
        checkRuntime('two-move-history-reload', restoredTwoMove.board.history.length === 2 && sameCells(restoredTwoMove.board.cells, afterTwoMoves) && restoredTwoMove.board.clearCommitted, 'two-move history did not restore its solved board');
        // 二手目をUndoした保存状態は、二手目の前のcellsと一件だけ残ったhistoryが一致しなければならない。
        const undoStage = { ...twoMoveStage, board:{ initialCells:[...secondInitial], cells:afterOneMove, history:[firstHistoryEntry], clearCommitted:false }, ui:{ dialog:null } };
        const restoredUndo = normalizePersistentAppState(undoStage);
        checkRuntime('undo-after-two-moves-reload', restoredUndo.board.history.length === 1 && sameCells(restoredUndo.board.cells, afterOneMove) && !restoredUndo.board.clearCommitted, 'undo state did not restore its one-move board');
        const oneMoveStage = undoStage;
        const restoredOneMove = normalizePersistentAppState(oneMoveStage);
        checkRuntime('one-move-reload', restoredOneMove.navigation.puzzleId === secondPuzzle.puzzleId && restoredOneMove.board.history.length === 1 && sameCells(restoredOneMove.board.cells, afterOneMove), 'one-move reload did not preserve stage state');
        const malformedHistory = normalizePersistentAppState({ ...twoMoveStage, board:{ ...twoMoveStage.board, history:[firstHistoryEntry, { ...secondHistoryEntry, before:[...secondInitial] }] } });
        checkRuntime('malformed-history-fallback', malformedHistory.board.history.length === 0 && sameCells(malformedHistory.board.cells, secondInitial), 'malformed history did not fall back to the initial board');
        const malformedPuzzleContext = normalizePersistentAppState({ ...oneMoveStage, navigation:{ ...oneMoveStage.navigation, puzzleId:'unknown-puzzle' } });
        checkRuntime('malformed-puzzle-id-fallback', malformedPuzzleContext.navigation.puzzleId === puzzleAt(0).puzzleId && sameCells(malformedPuzzleContext.board.cells, puzzleInitialCells(puzzleAt(0))), 'malformed puzzle id did not fall back safely');
      }
      return Object.freeze({ passed:errors.length === 0, errors:Object.freeze(errors), stateCount:WakeSevenBoardDomain.stateCount, reachableCount:seen.size, distanceDistribution:Object.freeze(distribution), stageReferenceCount:NORMAL_PUZZLES.length, symmetryCount:VIEW_SYMMETRIES.length, initialDistance, renderedInitialCells:initialCells.length, renderedSolvedCells:solvedCells.length, axisCount:TRIANGLES.length, runtimeChecks:Object.freeze(runtimeChecks) });
    }
    // 起動時に盤面ルールと操作の前提を確認してから表示する
    const selftestResult = runSelftest();
    if (!selftestResult.passed) throw new Error(`board self-test failed: ${selftestResult.errors.slice(0, 3).join('; ')}`);
    boardElement.dataset.selftest = 'passed';
    boardElement.dataset.checkedStates = String(selftestResult.stateCount);
    boardElement.dataset.checkedAxes = String(selftestResult.axisCount);
    boardElement.dataset.checkedRenders = `${selftestResult.renderedInitialCells}+${selftestResult.renderedSolvedCells}`;
    boardElement.dataset.checkedRuntime = selftestResult.runtimeChecks.join(',');
    // 復元時は途中演出を再生せず、保存済みの安定盤面（クリアならダイアログ）をそのまま出す。
    if (restoredFromStorage) renderRuntime({ context:'restore' });
    else runArrivalEffect();
  </script>
</body>
</html>
