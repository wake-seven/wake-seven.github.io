<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>だるまさんを起こして！</title>
  <style>
    /* ページ全体の見た目 */
    :root { --ai:#16283c; --ai2:#1f3752; --washi:#f7eedc; --washi2:#bccdd3; --kin:#c9a54e; --content-max:23.25rem; --w7-application-flash-opacity:0; --w7-application-flash-glow:0px; --w7-application-flash-glow-opacity:0; }
    html { font-size:calc(16px * clamp(1,calc(100vw / 570px),1.5)); max-width:100%; overflow-x:hidden; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; max-width:100%; display:flex; flex-direction:column; align-items:center; padding:1.125rem 0.75rem max(0.75rem,env(safe-area-inset-bottom)); background:var(--ai); background-image:radial-gradient(120% 70% at 50% 0%,var(--ai2) 0%,var(--ai) 62%); color:var(--washi); font-family:"A1 Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif; }
    /* 画面の枠 */
    .w7-shell { position:relative; width:100%; max-width:var(--content-max); }
    .w7-brand-sub { display:flex; align-items:center; justify-content:center; gap:.625rem; margin:0; color:var(--kin); font-size:.625rem; font-weight:750; letter-spacing:.27em; }
    .w7-brand-sub::before,.w7-brand-sub::after { content:""; width:1.875rem; height:1px; background:linear-gradient(90deg,transparent,rgb(201 165 78 / .8)); }
    .w7-brand-sub::after { background:linear-gradient(90deg,rgb(201 165 78 / .8),transparent); }
    .w7-app-title { margin:.4375rem 0 .35rem; text-align:center; font-size:1.3125rem; font-weight:800; letter-spacing:.07em; }
    .w7-stage-label { margin:0 0 .8rem; text-align:center; color:#b9e8f2; font-weight:700; }
    /* 盤面、棒、操作ボタン */
    .w7-board-feature { display:grid; gap:0.625rem; }
    .w7-board-status { display:flex; justify-content:center; gap:1.5rem; min-height:1.75rem; font-weight:700; font-size:1.05rem; font-variant-numeric:tabular-nums; }
    .w7-board-status strong { display:inline-block; min-width:1.25ch; text-align:right; color:#f5d66d; font-size:1.2em; }
    /* 速解き九番は学園HUDを保ちつつ、現在手数ではなく残り手数と時計だけを見る。 */
    .w7-speed-hud { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:.55rem; min-height:2.1rem; padding:.05rem .15rem 0; font-variant-numeric:tabular-nums; }
    .w7-speed-hud[hidden] { display:none; }
    .w7-speed-remaining { min-width:0; color:var(--washi); font-size:1.28rem; font-weight:850; letter-spacing:.015em; white-space:nowrap; }
    .w7-speed-remaining strong { color:#f5d66d; font-size:1.45em; }
    .w7-speed-clock { min-width:4.8rem; color:#b9e8f2; font-size:1.08rem; font-weight:800; text-align:right; transform:translate(.12rem,.1rem); }
    body.w7-speed-mode .w7-board-status { display:none; }
    body.w7-speed-mode .w7-board-feature { gap:.48rem; }
    .w7-speed-pause-button { min-width:6.4rem; border-color:#62b8d2; background:#dff4f8; }
    /* 360pxでも「残り手数 → 時計 → 一時停止」を一行で保つ。時計とpauseは上下中央をそろえる。 */
    @media (max-width:480px) {
      .w7-speed-hud { grid-template-columns:minmax(0,1fr) 3.75rem 6.4rem; gap:.25rem; padding-left:0; padding-right:0; }
      .w7-speed-remaining { font-size:.98rem; }
      .w7-speed-remaining strong { font-size:1.35em; }
      .w7-speed-clock { min-width:0; font-size:.94rem; transform:translate(.06rem,.08rem); }
    }
    .w7-board-frame { position:relative; width:100%; max-width:var(--content-max); margin:0 auto; }
    .w7-board { display:block; width:100%; height:auto; overflow:visible; touch-action:none; user-select:none; -webkit-user-select:none; cursor:default; }
    .w7-cell { transform-box:view-box; transform-origin:0 0; will-change:transform; transition:opacity .12s ease,filter .12s ease; }
    .w7-cell-visual { transform-box:view-box; transform-origin:0 0; }
    .w7-cell-hex { fill:var(--washi); stroke:#c0ac88; stroke-width:1.5; }
    .w7-cell--fallen .w7-cell-hex { fill:var(--washi2); stroke:#c0ac88; }
    .w7-cell--standing { filter:brightness(1.04); }
    /* 報酬の盤面色は本編だけに適用する。ダイアログ内の見本盤は標準色のまま。 */
    body[data-w7-board-theme="gold"] #w7-board .w7-cell--standing .w7-cell-hex { fill:#F6DE93; stroke:#C89C35; }
    body[data-w7-board-theme="gold"] #w7-board .w7-cell--fallen .w7-cell-hex { fill:#D7B75F; stroke:#C89C35; }
    body[data-w7-board-theme="satori"] #w7-board .w7-cell--standing .w7-cell-hex { fill:#F1F1ED; stroke:#D6D6D0; }
    body[data-w7-board-theme="satori"] #w7-board .w7-cell--fallen .w7-cell-hex { fill:#AAA9A4; stroke:#D6D6D0; }
    .w7-cell.is-grabbed .w7-cell-hex { animation:w7-grab-flash .34s cubic-bezier(.18,.8,.24,1); }
    @keyframes w7-grab-flash { 0%,100% { filter:drop-shadow(0 0 0 rgb(98 215 244 / 0)); } 45% { filter:drop-shadow(0 0 10px rgb(98 215 244 / .9)) brightness(1.22); } }
    /* Daruma artwork is authored around local (0,0), the same center as its panel. */
    .w7-daruma { transform-origin:0 0; }
    .w7-axis-pivot { fill:var(--kin); opacity:.72; pointer-events:none; }
    .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; stroke-width:1.25; pointer-events:none; filter:drop-shadow(0 1px 1px rgb(0 0 0 / .25)); }
    /* チュートリアルで次に回す棒。盤面の入力判定は共通のまま、見た目だけを強調する。 */
    .w7-axis-layer [data-axis].w7-tutorial-target .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; stroke-width:1.25; filter:drop-shadow(0 0 5px rgb(98 215 244 / .78)); animation:w7-tutorial-grip-pulse 1.2s ease-in-out infinite; }
    /* 修行と名人・序の「次の1手」。番号を知らなくても、回す三枚・棒・向きが盤面だけで分かるようにする。 */
    .w7-cell.w7-next-move-target .w7-cell-hex { stroke:#bff0ff; stroke-width:3; filter:drop-shadow(0 0 5px rgb(98 215 244 / .72)); }
    .w7-axis-layer g[data-axis].w7-next-move-target .w7-axis-grip { fill:#bff0ff; stroke:#3e9bc2; stroke-width:2; filter:drop-shadow(0 0 7px rgb(98 215 244 / .95)); animation:w7-tutorial-grip-pulse .75s ease-in-out infinite; }
    .w7-axis-pivot.w7-next-move-target { opacity:1; filter:drop-shadow(0 0 5px rgb(201 165 78 / .9)); }
    /* 最初の補助では、正解の棒以外を見せない。探索の段階ではこのclassを付けない。 */
    .w7-axis-layer g[data-axis].w7-tutorial-hidden { opacity:0; }
    /* 入門編は「どの棒か」を考える画面。候補外と、誤って消えた棒は描画も入力も外す。 */
    .w7-axis-layer g[data-axis].w7-academy-hidden { opacity:0; pointer-events:none; }
    .w7-axis-layer g[data-axis].w7-academy-fallen { opacity:.55; pointer-events:none; filter:grayscale(1) brightness(.75); }
    .w7-axis-layer g[data-axis].w7-academy-fallen .w7-axis-grip { fill:#8a96a3; stroke:#5b6673; }
    .w7-axis-layer g[data-axis].w7-application-fallen { opacity:.55; pointer-events:none; filter:grayscale(1) brightness(.75); }
    .w7-axis-layer g[data-axis].w7-application-fallen .w7-axis-grip { fill:#8a96a3; stroke:#5b6673; }
    .w7-axis-layer g[data-axis].w7-academy-candidate .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; filter:drop-shadow(0 0 5px rgb(98 215 244 / .68)); }
    /* 九番の候補棒は学園と同じ水色。誤った候補だけをこの問題の終わりまで落とす。 */
    .w7-axis-layer g[data-axis].w7-speed-hidden { opacity:0; pointer-events:none; }
    .w7-axis-layer g[data-axis].w7-speed-candidate .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; filter:drop-shadow(0 0 5px rgb(98 215 244 / .68)); }
    .w7-axis-layer g[data-axis].w7-speed-fallen { opacity:.55; pointer-events:none; filter:grayscale(1) brightness(.75); }
    .w7-axis-layer g[data-axis].w7-speed-fallen .w7-axis-grip { fill:#8a96a3; stroke:#5b6673; }
    @keyframes w7-tutorial-grip-pulse { 50% { opacity:.58; } }
    .w7-board.is-grip-hover { cursor:grab; }
    .w7-board[data-phase="dragging"] { cursor:grabbing; }
    /* 棒はつかんで回転している間と、全員が起きた後には表示しない。 */
    .w7-board:not([data-phase="ready"]) .w7-axis-layer { opacity:0; }
    .w7-board[data-solved="true"] .w7-axis-layer { opacity:0; }
    .w7-board.is-invalid-grab .w7-cell { opacity:.28; filter:saturate(.55) brightness(.62); }
    .w7-board.is-invalid-grab .w7-axis-pivot { opacity:.18; }
    .w7-grip-prompt { position:absolute; z-index:2; inset:0; display:grid; place-items:center; pointer-events:none; padding:2.5rem 1.25rem; text-align:center; }
    /* 旧チュートリアルと同じく、回す三枚を隠さないよう案内は盤面上側へ置く。 */
    body.w7-tutorial-mode .w7-grip-prompt { place-items:start center; padding:0.75rem 1.25rem 0; }
    .w7-grip-prompt[hidden] { display:none; }
    .w7-grip-prompt span { display:block; padding:.6rem .8rem; border:1px solid rgb(98 215 244 / .66); border-radius:.4rem; background:rgb(22 40 60 / .86); color:#b9e8f2; font-size:clamp(1rem,4vw,1.25rem); font-weight:800; line-height:1.35; box-shadow:0 4px 18px rgb(0 0 0 / .28); }
    .w7-academy-callout { position:absolute; z-index:11; inset:0; display:grid; place-items:center; pointer-events:none; opacity:0; transition:opacity .22s ease; }
    .w7-academy-callout[hidden] { display:none; }
    .w7-academy-callout.is-visible { opacity:1; }
    .w7-academy-callout-badge { display:inline-flex; align-items:center; gap:.25rem; padding:.85rem 1.25rem .8rem; border:2px solid #29a8ce; border-radius:999px; background:rgb(15 35 52 / .85); box-shadow:0 5px 20px rgb(0 0 0 / .34); }
    .w7-academy-callout-label,.w7-academy-callout-unit { color:#9bcBDD; font-size:1.18rem; font-weight:700; transform:translateY(.35rem); }
    .w7-academy-callout-number { color:#62b8d2; font-size:3.75rem; font-weight:750; line-height:1; text-shadow:0 0 10px rgb(98 184 210 / .24); }
    /* P5-2 応用導入: 完成形の静止見本、右上の縮小見本、実盤面上の型ガイド。
       いずれもゲーム盤の状態や入力を持たない表示専用の要素にする。 */
    .w7-application-intro-demo,.w7-application-intro-message { opacity:0; transition:opacity .24s ease; pointer-events:none; }
    .w7-application-intro-demo.is-visible,.w7-application-intro-message.is-visible { opacity:1; }
    .w7-application-intro-demo.is-leaving,.w7-application-intro-message.is-leaving { opacity:0; }
    /* 応用の対象三枚は、六角パネルの面全体を短く同時にピカッと光らせる。
       通常時は元の色を残し、実盤面と右上ガイドを共通時刻で同時に発光させる。 */
    /* ページ共通の発光値を全対象が読む。セルを回転レイヤーへ移しても、
       パネルごとのアニメーション開始時刻を持たないので位相はずれない。 */
    .w7-application-target-flash { fill:#f8eaff; opacity:var(--w7-application-flash-opacity); pointer-events:none; mix-blend-mode:screen; filter:drop-shadow(0 0 var(--w7-application-flash-glow) rgb(231 191 255 / var(--w7-application-flash-glow-opacity))); will-change:opacity,filter; }
    .w7-application-intro-badge { fill:rgb(15 35 52 / .9); stroke:#62b8d2; stroke-width:2; }
    .w7-application-intro-title { fill:var(--washi); font:800 20px "A1 Gothic","Hiragino Kaku Gothic ProN",sans-serif; text-anchor:middle; }
    .w7-application-intro-copy { fill:#8bcde0; font:700 13px "A1 Gothic","Hiragino Kaku Gothic ProN",sans-serif; text-anchor:middle; }
    .w7-application-target-preview { position:absolute; z-index:3; right:-.3rem; top:-2.9rem; display:flex; align-items:center; gap:.1rem; color:#d8be78; font-size:.6875rem; font-weight:700; line-height:1; white-space:nowrap; pointer-events:none; opacity:1; transition:opacity .28s ease; }
    .w7-application-target-preview[hidden] { display:none; }
    .w7-application-target-preview.is-fading { opacity:0; }
    .w7-application-target-preview svg { display:block; width:7.7rem; height:5rem; overflow:visible; transform:translate(1.15rem,.55rem); }
    .w7-application-target-preview.is-entering { animation:w7-application-preview-enter .62s cubic-bezier(.18,.82,.24,1) both; }
    @keyframes w7-application-preview-enter { from { opacity:0; transform:translate(-4.7rem,3rem) scale(1.72); } to { opacity:1; transform:translate(0,0) scale(1); } }
    .w7-application-shape-guide { opacity:0; transition:opacity .22s ease; pointer-events:none; }
    .w7-application-shape-guide.is-visible { opacity:1; }
    .w7-application-shape-outline { fill:none; stroke:#29a8ce; stroke-width:8; stroke-linejoin:round; filter:drop-shadow(0 0 2px rgb(10 30 45 / .45)); }
    .w7-application-shape-badge { fill:rgb(15 35 52 / .9); stroke:#62b8d2; stroke-width:2; }
    .w7-application-shape-title { fill:var(--washi); font:800 17px "A1 Gothic","Hiragino Kaku Gothic ProN",sans-serif; text-anchor:middle; }
    .w7-application-shape-name { fill:#8bcde0; font:800 21px "A1 Gothic","Hiragino Kaku Gothic ProN",sans-serif; text-anchor:middle; }
    /* 指定方向を伝える、旧版と同じ水色／白縁の弧。盤面の入力とは独立した表示だけのSVG。 */
    .w7-tutorial-arrow,.w7-next-move-arrow { pointer-events:none; }
    .w7-tutorial-arrow .w7-arrow-border,.w7-next-move-arrow .w7-arrow-border { fill:none; stroke:#bff0ff; stroke-width:8.5; stroke-linecap:round; }
    .w7-tutorial-arrow .w7-arrow-line,.w7-next-move-arrow .w7-arrow-line { fill:none; stroke:#62b8d2; stroke-width:5.5; stroke-linecap:round; filter:drop-shadow(0 0 3px rgb(22 40 60 / .9)); }
    .w7-tutorial-arrow .w7-arrow-head,.w7-next-move-arrow .w7-arrow-head { fill:#62b8d2; stroke:#bff0ff; stroke-width:1.5; stroke-linejoin:round; animation:w7-tutorial-grip-pulse 1.2s ease-in-out infinite; }
    .w7-board-controls { display:flex; justify-content:center; flex-wrap:wrap; gap:0.75rem; }
    .w7-board-controls[hidden] { display:none; }
    /* custom board / 自作問題: 編集時は棒を隠し、盤面の七枚を直接選んで向きを作る。 */
    .w7-custom-editor { display:grid; gap:.55rem; justify-items:center; margin:-.15rem 0 .3rem; text-align:center; }
    .w7-custom-editor[hidden] { display:none; }
    .w7-custom-editor-message { margin:0; color:#b9e8f2; font-size:clamp(.95rem,3.8vw,1.1rem); font-weight:700; line-height:1.55; }
    .w7-custom-editor-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:.55rem; }
    .w7-custom-editor .w7-board-button { min-height:2.55rem; }
    body.w7-custom-editor-mode .w7-board-status { display:none; }
    body.w7-custom-editor-mode #w7-board { cursor:pointer; }
    body.w7-custom-editor-mode #w7-board .w7-cell { cursor:pointer; outline:none; }
    body.w7-custom-editor-mode #w7-board .w7-cell:focus .w7-cell-hex { stroke:#62d7f4; stroke-width:3; filter:drop-shadow(0 0 5px rgb(98 215 244 / .72)); }
    .w7-board-button { min-width:7rem; min-height:2.75rem; border:1px solid #c0ac88; border-radius:999px; padding:0.55rem 1rem; background:var(--washi); color:#2d2925; font:inherit; font-weight:700; box-shadow:0 2px 0 rgb(0 0 0 / .24); cursor:pointer; }
    .w7-training-tip-button { min-width:6.4rem; border-color:#62b8d2; background:#dff4f8; }
    .w7-training-shape-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.45rem; margin:.8rem 0; }
    .w7-training-shape-card { padding:.25rem; border:1px solid rgb(98 184 210 / .5); border-radius:.55rem; background:rgb(98 184 210 / .08); color:#d9f4fb; font-size:.76rem; font-weight:700; }
    .w7-training-shape-card svg { display:block; width:100%; height:auto; }
    .w7-training-demo { display:block; width:min(100%,17rem); margin:.45rem auto; overflow:visible; }
    .w7-training-welcome-art { display:block; width:min(100%,18rem); margin:.25rem auto .65rem; border-radius:.7rem; overflow:hidden; }
    .w7-training-dialog-copy { color:#c9dfe7; font-weight:700; }
    .w7-board-button:focus-visible { outline:3px solid #7dd8f5; outline-offset:3px; }
    .w7-board-button:disabled { opacity:.42; cursor:default; box-shadow:none; }
    /* 開発用の状態移動は一番下へ集約する。本編ボタンと見分けるため、短い控えめなチップにする。 */
    .w7-debug-tools { display:flex; justify-content:center; flex-wrap:wrap; gap:.35rem; margin:1.1rem auto 0; }
    .w7-debug-button { min-width:2.35rem; min-height:2rem; border:1px solid rgb(98 184 210 / .38); border-radius:999px; padding:.25rem .6rem; background:rgb(22 40 60 / .62); color:#afc3d0; font:inherit; font-size:.78rem; font-weight:700; cursor:pointer; }
    .w7-debug-button:hover { border-color:rgb(125 216 245 / .8); color:#d8f3fa; }
    .w7-debug-button:focus-visible { outline:2px solid #7dd8f5; outline-offset:3px; }
    .w7-clear-burst { pointer-events:none; transform-box:view-box; }
    .w7-dialog-backdrop { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:1rem; background:rgb(4 13 24 / .7); backdrop-filter:blur(4px); }
    .w7-dialog-backdrop[hidden] { display:none; }
    .w7-dialog { position:relative; width:min(100%,22rem); border:2px solid #7dd8f5; border-radius:1rem; padding:1.35rem; background:var(--ai2); color:var(--washi); box-shadow:0 1rem 3rem rgb(0 0 0 / .42); text-align:center; }
    .w7-dialog h2 { margin:0 0 .6rem; font-size:1.55rem; }
    .w7-dialog p { margin:.3rem 0 1rem; line-height:1.55; }
    /* 速解き試験の合格印。旧版と同じ緑の判子SVGを、合格文言と一組で出す。 */
    .w7-speed-trial-badge { display:flex; align-items:center; justify-content:center; gap:.62rem; width:fit-content; max-width:100%; margin:.35rem auto 1rem; padding:.52rem .8rem; border:1px solid rgb(201 165 78 / .82); border-radius:.65rem; background:linear-gradient(135deg,rgb(201 165 78 / .26),rgb(22 40 60 / .15)); color:#f8e6ad; font-size:.94rem; font-weight:800; line-height:1.4; text-align:left; }
    .w7-speed-trial-badge-stamp { display:block; flex:0 0 auto; width:2.55rem; height:2.55rem; overflow:visible; filter:drop-shadow(0 2px 1px rgb(0 0 0 / .2)); }
    .w7-speed-trial-badge-label { min-width:0; white-space:pre-line; }
    .w7-clear-stage-context { position:absolute; top:.9rem; right:1rem; margin:0!important; color:#9bcBDD; font-size:.78rem; font-weight:700; line-height:1.2!important; }
    .w7-clear-note { margin:.625rem 0 .75rem!important; padding:.7rem .8rem; border-radius:.25rem; background:rgb(98 184 210 / .1); color:#b9e8f2; font-size:1.08rem; font-weight:700; line-height:1.62!important; text-align:left; white-space:pre-line; }
    .w7-clear-art { display:block; width:min(100%,14rem); height:8rem; margin:.25rem auto .75rem; overflow:visible; }
    .w7-clear-guide-art { width:min(100%,13.5rem); height:auto; max-height:14rem; }
    .w7-clear-quiz { display:grid; gap:.4rem; margin:.75rem 0 1rem; text-align:left; }
    .w7-clear-quiz { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .w7-clear-quiz p { grid-column:1 / -1; margin:0; color:#b9e8f2; font-size:.9rem; font-weight:700; }
    .w7-clear-quiz button { border:1px solid rgb(185 232 242 / .22); border-radius:.45rem; padding:.45rem .6rem; background:rgb(255 255 255 / .04); color:#b9e8f2; font:inherit; font-size:.78rem; font-weight:700; text-align:left; cursor:pointer; }
    .w7-clear-quiz button.is-correct { border-color:#56c7a2; background:rgb(86 199 162 / .14); }
    .w7-clear-quiz button.is-wrong { border-color:#df6c61; background:rgb(223 108 97 / .13); }
    .w7-clear-quiz-note { min-height:1.4rem!important; color:#b9c6d6!important; font-size:.78rem!important; font-weight:600!important; }
    .w7-clear-quiz.is-success { position:relative; }
    .w7-clear-quiz.is-success::before,.w7-clear-quiz.is-success::after { position:absolute; z-index:2; color:#f2d77a; font-size:1.125rem; line-height:1; opacity:0; pointer-events:none; animation:w7-quiz-spark .7s cubic-bezier(.18,.8,.24,1) both; }
    .w7-clear-quiz.is-success::before { content:"✦"; top:24%; left:7%; }
    .w7-clear-quiz.is-success::after { content:"✧"; top:14%; right:8%; animation-delay:.09s; }
    .w7-clear-quiz.is-success button.is-correct { animation:w7-quiz-correct-pop .48s cubic-bezier(.18,.9,.25,1) both; }

          && sameCells(restoredFreeClear.progress.lap1CompletedPuzzleIds, freeIsolationSource.progress.lap1CompletedPuzzleIds)
          && sameCells(restoredFreeClear.progress.tutorialCompletedPuzzleIds, freeIsolationSource.progress.tutorialCompletedPuzzleIds)
          && sameCells(restoredFreeClear.speed.completedTrialIds, freeIsolationSource.speed.completedTrialIds)
          && restoredFreeClear.rewards.masterGoldGranted && restoredFreeClear.settings.theme === 'gold' && restoredFreeClear.settings.themeChosen, 'free clear changed course progress, speed records, or rewards'],
        ['corrupt-descriptor-recovery', () => corruptFreeActive?.navigation.mode === 'free' && corruptFreeActive.free.returnNavigation?.routeId === 'tutorial' && corruptFreeActive.free.savedSession?.initialState === freeInitialState && corruptFreeActive.free.activeSession?.par >= 2 && corruptFreeActive.free.activeSession?.par <= 4
          && corruptFreeLeave?.navigation.mode === 'tutorial' && corruptFreeLeave.free.savedSession?.initialState === corruptFreeActive.free.activeSession?.initialState
          && corruptFreeSaved?.navigation.routeId === 'academy-intro' && corruptFreeSaved.free.savedSession === null, 'free corrupt descriptor recovery is invalid'],
      ]);
      return { freeSession, freeAfterOne, freeMidState };
    }

    function checkCustomBoardContracts(checkRuntimeEach, { freeSession, freeAfterOne, freeMidState }) {
      // P7e 自作問題: editorとplayingを一つのphase descriptorにし、solver判定、履歴、F5、
      // clear後のeditor復帰を検査する。通常進捗と自由savedはここで変えない。
      const customOneCells = Array.from(WakeSevenBoardDomain.decode(SOLVER.byDepth[1][0]));
      const customTwoCells = Array.from(WakeSevenBoardDomain.decode(SOLVER.byDepth[2][0]));
      const customEditor = makeCustomEditorSession(SOLVED_BOARD, makeTutorialNavigation(0));
      const customCycleOne = makeCustomEditedSession(customEditor, 0);
      const customCycleTwo = makeCustomEditedSession(customCycleOne, 0);
      const customCycleThree = makeCustomEditedSession(customCycleTwo, 0);
      const customOneEditor = makeCustomEditorSession(customOneCells, makeTutorialNavigation(0));
      const customPlaying = makeCustomPlayingSession(customOneEditor);
      const customTwoPlaying = makeCustomPlayingSession(makeCustomEditorSession(customTwoCells, makeTutorialNavigation(0)));
      const customMove = customTwoPlaying && TRIANGLES.flatMap((_, triangleIndex) => [1, -1].map(direction => ({ triangleIndex, direction })))
        .find(move => selectDistance(WakeSevenBoardDomain.roll(customTwoPlaying.cells, move.triangleIndex, move.direction)) === customTwoPlaying.par - 1);
      const customMid = customTwoPlaying && customMove ? {
        ...customTwoPlaying,
        cells:Array.from(WakeSevenBoardDomain.roll(customTwoPlaying.cells, customMove.triangleIndex, customMove.direction)),
        history:[{ ...customMove, before:[...customTwoPlaying.cells], after:Array.from(WakeSevenBoardDomain.roll(customTwoPlaying.cells, customMove.triangleIndex, customMove.direction)) }],
      } : null;
      const customEditorState = customEditor && makeCustomAppState(makeDefaultAppState(), customEditor);
      const customPlayingState = customPlaying && makeCustomAppState(makeDefaultAppState(), customPlaying);
      const customMidState = customMid && makeCustomAppState(makeDefaultAppState(), customMid);
      const customSolvedBoard = customPlaying && buildShortestSolvedBoard(makeCustomPuzzle(customPlaying));
      const customClearSession = customPlaying && customSolvedBoard ? { ...customPlaying, cells:[...customSolvedBoard.cells], history:cloneFreeHistory(customSolvedBoard.history), clearCommitted:true } : null;
      const customClearState = customClearSession && makeCustomAppState(makeDefaultAppState(), customClearSession, { dialog:{ type:'custom-clear', puzzleId:makeCustomPuzzle(customClearSession).puzzleId } });
      const restoredCustomEditor = customEditorState && normalizePersistentAppState(customEditorState);
      const restoredCustomMid = customMidState && normalizePersistentAppState(customMidState);
      const restoredCustomClear = customClearState && normalizePersistentAppState(customClearState);
      const migratedP7dFree = freeMidState && normalizePersistentAppState({ ...freeMidState, schemaVersion:8, custom:undefined });
      const corruptCustomPlaying = customPlayingState && normalizePersistentAppState({ ...customPlayingState, custom:{ activeSession:{ ...customPlaying, par:99 } } });
      const normalAfterCorruptCustom = corruptCustomPlaying && makeCustomLeaveAppState(corruptCustomPlaying);
      const impossibleCustom = debugCustomImpossibleCells();
      const customProgressIsolation = makeCustomAppState({
        ...makeDefaultAppState(),
        progress:{ tutorialCompleted:true, tutorialCompletedPuzzleIds:[TUTORIAL_STEPS[0].puzzleId], lap1CompletedPuzzleIds:[ACADEMY_INTRO_PUZZLES[0].puzzleId], lap2CompletedPuzzleIds:[] },
        free:{ activeSession:null, savedSession:freeSession, returnNavigation:null },
      }, customPlaying);
      // 自由の途中盤面だけでなく、自由が通常コースのどこから開かれたかも自作往復で保つ。
      const customFromFree = freeMidState && makeCustomAppState(freeMidState,
        makeCustomEditorSession(SOLVED_BOARD, customReturnNavigationForEntry(freeMidState)));
      const freeAfterCustom = customFromFree && makeCustomLeaveAppState(customFromFree);
      const normalAfterCustomFree = freeAfterCustom && makeFreeLeaveAppState(freeAfterCustom);
      // custom本体が壊れても、独立した戻り先を保てば通常／自由のどちらへも復帰できる。
      const customFreePlaying = customFromFree && makeCustomAppState(customFromFree,
        makeCustomPlayingSession(makeCustomEditorSession(customOneCells, customFromFree.custom.activeSession?.returnNavigation)));
      const corruptCustomFromFree = customFreePlaying && normalizePersistentAppState({
        ...customFreePlaying,
        custom:{ activeSession:{ ...customFreePlaying.custom.activeSession, par:99 } },
      });
      const freeAfterCorruptCustom = corruptCustomFromFree && makeCustomLeaveAppState(corruptCustomFromFree);
      const normalAfterCorruptCustomFree = freeAfterCorruptCustom && makeFreeLeaveAppState(freeAfterCorruptCustom);
      const corruptFreeReturn = customFreePlaying && normalizePersistentAppState({
        ...customFreePlaying,
        custom:{ activeSession:{
          ...customFreePlaying.custom.activeSession,
          returnNavigation:{ ...customFreePlaying.custom.activeSession.returnNavigation, puzzleId:'free-corrupt' },
        } },
      });
      const normalAfterCorruptFreeReturn = corruptFreeReturn && makeCustomLeaveAppState(corruptFreeReturn);
      const customHexCenter = CELL_POSITIONS[0];
      const customHexCorner = { x:customHexCenter.x, y:customHexCenter.y - CELL_RADIUS * .98 };
      // 隣のpanelと共有しない外周の斜辺のすぐ外。旧円近似なら受理してしまう座標。
      const customHexOutsideSlope = { x:customHexCenter.x + 24, y:customHexCenter.y - 42 };
      // Undo／Restart後に共通boardから同期するdescriptorと、debug solver結果の可変変換を検査する。
      const customUndoBoard = customMid && { initialCells:[...customMid.initialCells], cells:[...customMid.initialCells], history:[], clearCommitted:false };
      const customRestartBoard = customMid && { initialCells:[...customMid.initialCells], cells:[...customMid.initialCells], history:[], clearCommitted:false };
      const customAfterUndo = customUndoBoard && makeCustomPlayingSessionForBoard(customMid, customUndoBoard);
      const customAfterRestart = customRestartBoard && makeCustomPlayingSessionForBoard(customMid, customRestartBoard);
      const debugWritableCustomBoard = customSolvedBoard && makeDebugWritableBoard(customSolvedBoard);
      const customDebugClearSession = debugWritableCustomBoard && makeCustomPlayingSessionForBoard(customPlaying, { ...debugWritableCustomBoard, clearCommitted:true });
      checkRuntimeEach('custom', [
        ['editor-cycle', () => customEditor?.phase === 'editing' && selectDistance(customEditor.cells) === 0
          && customCycleOne?.cells[0] === 1 && customCycleTwo?.cells[0] === 2 && customCycleThree?.cells[0] === 0, 'custom editor did not cycle one cell through its three orientations'],
        ['play-conversion', () => Boolean(customOneEditor) && selectDistance(customOneEditor.cells) === 1 && customPlaying?.phase === 'playing' && customPlaying.par === 1
          && Boolean(customMid) && normalizeCustomSession(customMid)?.history.length === 1, 'custom editor did not create a playable solver-backed board'],
        ['impossible-board', () => Boolean(impossibleCustom) && selectDistance(impossibleCustom) === null, 'custom editor lost its impossible-board state'],
        ['reload-editor', () => restoredCustomEditor?.navigation.mode === 'custom' && restoredCustomEditor.custom.activeSession?.phase === 'editing' && sameCells(restoredCustomEditor.board.cells, SOLVED_BOARD), 'custom editor did not restore as an editor'],
        ['reload-playing', () => restoredCustomMid?.custom.activeSession?.phase === 'playing' && restoredCustomMid.board.history.length === 1 && Boolean(customMid) && sameCells(restoredCustomMid.board.cells, customMid.cells), 'custom playing board did not restore its history'],
        ['reload-clear', () => restoredCustomClear?.ui.dialog?.type === 'custom-clear' && restoredCustomClear.board.clearCommitted, 'custom clear dialog did not restore'],
        ['schema-migration', () => migratedP7dFree?.schemaVersion === APP_SCHEMA_VERSION && migratedP7dFree.navigation.mode === 'free' && migratedP7dFree.board.history.length === 1, 'custom schema migration changed a saved free board'],
        ['corrupt-playing-fallback', () => corruptCustomPlaying?.navigation.mode === 'custom' && corruptCustomPlaying.custom.activeSession?.phase === 'editing' && sameCells(corruptCustomPlaying.board.cells, SOLVED_BOARD)
          && corruptCustomPlaying.custom.activeSession?.returnNavigation?.routeId === 'tutorial'
          && normalAfterCorruptCustom?.navigation.mode === 'tutorial' && normalAfterCorruptCustom.navigation.tutorialStep === 0, 'corrupt custom playing session did not fall back to its editor and return route'],
        ['progress-isolation', () => customProgressIsolation?.progress.tutorialCompleted && customProgressIsolation.progress.lap1CompletedPuzzleIds.includes(ACADEMY_INTRO_PUZZLES[0].puzzleId)
          && customProgressIsolation.free.savedSession?.initialState === freeSession.initialState, 'custom session changed normal progress or saved free board'],
        ['free-round-trip', () => freeAfterCustom?.navigation.mode === 'free' && freeAfterCustom.free.returnNavigation?.routeId === 'tutorial'
          && freeAfterCustom.board.history.length === 1 && sameCells(freeAfterCustom.board.cells, freeAfterOne)
          && normalAfterCustomFree?.navigation.mode === 'tutorial' && normalAfterCustomFree.navigation.tutorialStep === 0, 'custom to free round-trip changed its saved route or board'],
        ['corrupt-free-return', () => corruptCustomFromFree?.navigation.mode === 'custom' && corruptCustomFromFree.custom.activeSession?.phase === 'editing'
          && corruptCustomFromFree.custom.activeSession?.returnNavigation?.mode === 'free'
          && corruptCustomFromFree.custom.activeSession?.returnNavigation?.freeReturnNavigation?.routeId === 'tutorial'
          && freeAfterCorruptCustom?.navigation.mode === 'free' && freeAfterCorruptCustom.free.returnNavigation?.routeId === 'tutorial'
          && freeAfterCorruptCustom.board.history.length === 1 && sameCells(freeAfterCorruptCustom.board.cells, freeAfterOne)
          && normalAfterCorruptCustomFree?.navigation.mode === 'tutorial' && normalAfterCorruptCustomFree.navigation.tutorialStep === 0
          && corruptFreeReturn?.navigation.mode === 'custom' && normalAfterCorruptFreeReturn?.navigation.mode === 'tutorial'
          && normalAfterCorruptFreeReturn.navigation.tutorialStep === 0, 'corrupt custom/free return route did not recover safely'],
        ['return-route-validation', () => cloneCustomReturnNavigation({ mode:'free', routeId:'academy-intro', puzzleId:'academy-intro-001' }) === null, 'custom accepted an invalid free return navigation'],
        ['hex-hit-test', () => customEditorCellAtPoint(customHexCorner, STANDARD_BOARD_VIEW) === 0 && customEditorCellAtPoint(customHexOutsideSlope, STANDARD_BOARD_VIEW) === null, 'custom editor hit test no longer follows the visible hexagon'],
        ['undo-restart-sync', () => customAfterUndo?.history.length === 0 && Boolean(customMid) && sameCells(customAfterUndo.cells, customMid.initialCells)
          && customAfterRestart?.history.length === 0 && sameCells(customAfterRestart.cells, customMid.initialCells), 'custom Undo or Restart did not synchronize the descriptor'],
        ['debug-board-contract', () => Boolean(debugWritableCustomBoard) && !Object.isFrozen(debugWritableCustomBoard) && normalizeCustomSession(customDebugClearSession)?.clearCommitted, 'custom debug solved board is not writable or cannot normalize'],
        ['pointer-gate', () => selectCanEditCustomPointer({ isPrimary:true, pointerType:'touch' }, customEditorState, { phase:BoardPhase.READY })
          && !selectCanEditCustomPointer({ isPrimary:false, pointerType:'touch' }, customEditorState, { phase:BoardPhase.READY }), 'custom editor pointer gate accepts a non-primary pointer'],
      ]);
    }

    function checkPersistenceContracts(checkRuntime, { academyClear, academyInitial }) {
      const preservedProgress = TUTORIAL_STEPS[0].puzzleId;
      const brokenBoard = normalizePersistentAppState({ ...academyClear, board:{ ...academyClear.board, cells:[9, 9, 9] }, progress:{ tutorialCompleted:true, tutorialCompletedPuzzleIds:[preservedProgress], lap1CompletedPuzzleIds:[], lap2CompletedPuzzleIds:[] }, rewards:{ masterGoldGranted:true, satoriDesignGranted:false }, settings:{ theme:'gold', layout:'satori-tilted' } });
      checkRuntime('broken-board-keeps-independent-state', sameCells(brokenBoard.board.cells, academyInitial) && brokenBoard.progress.tutorialCompletedPuzzleIds.includes(preservedProgress) && brokenBoard.settings.theme === 'gold' && brokenBoard.settings.layout === 'standard', 'broken board fallback changed independent progress or reward settings');
      const lockedRewardSettings = normalizePersistentAppState({ ...makeDefaultAppState(), settings:{ theme:'gold', layout:'satori-tilted', themeChosen:true, layoutChosen:true } });
      checkRuntime('locked-reward-selection-fallback', lockedRewardSettings.settings.theme === 'standard' && lockedRewardSettings.settings.layout === 'standard', 'locked reward selection was not normalized');
      const zeroMoveRestore = normalizePersistentAppState(makeDefaultAppState());
      checkRuntime('tutorial-zero-move-reload', zeroMoveRestore.navigation.mode === 'tutorial' && zeroMoveRestore.navigation.tutorialStep === 0 && zeroMoveRestore.board.history.length === 0 && sameCells(zeroMoveRestore.board.cells, puzzleInitialCells(tutorialStepAt(0))), 'tutorial zero-move reload changed the board');
      const twoStep = tutorialStepAt(3);
      const twoStepInitial = puzzleInitialCells(twoStep);
      const firstMove = twoStep.solution[0];
      const secondMove = twoStep.solution[1];
      const afterOneMove = Array.from(WakeSevenBoardDomain.roll(twoStepInitial, firstMove.triangleIndex, firstMove.direction));
      const afterTwoMoves = Array.from(WakeSevenBoardDomain.roll(afterOneMove, secondMove.triangleIndex, secondMove.direction));
      const firstHistoryEntry = { triangleIndex:firstMove.triangleIndex, direction:firstMove.direction, before:[...twoStepInitial], after:afterOneMove };
      const secondHistoryEntry = { triangleIndex:secondMove.triangleIndex, direction:secondMove.direction, before:afterOneMove, after:afterTwoMoves };
      const midTutorial = makeAppStateForNavigation(makeTutorialNavigation(3), { progress:makeDefaultProgress() });
      midTutorial.board = { initialCells:[...twoStepInitial], cells:afterOneMove, history:[firstHistoryEntry], clearCommitted:false };
      const restoredMidTutorial = normalizePersistentAppState(midTutorial);
      checkRuntime('tutorial-one-move-reload', restoredMidTutorial.navigation.tutorialStep === 3 && restoredMidTutorial.board.history.length === 1 && sameCells(restoredMidTutorial.board.cells, afterOneMove), 'tutorial one-move reload did not preserve its stable board');
      const solvedTutorial = { ...midTutorial, board:{ initialCells:[...twoStepInitial], cells:afterTwoMoves, history:[firstHistoryEntry, secondHistoryEntry], clearCommitted:false } };
      const restoredSolvedTutorial = normalizePersistentAppState(solvedTutorial);
      checkRuntime('tutorial-solved-reload-advances', restoredSolvedTutorial.navigation.tutorialStep === 4 && restoredSolvedTutorial.board.history.length === 0 && !restoredSolvedTutorial.board.clearCommitted, 'solved tutorial reload did not advance to the next stable step');
      const malformedHistory = normalizePersistentAppState({ ...midTutorial, board:{ ...midTutorial.board, history:[{ ...firstHistoryEntry, before:[...twoStepInitial.map(() => 0)] }] } });
      checkRuntime('tutorial-malformed-history-fallback', malformedHistory.navigation.tutorialStep === 3 && malformedHistory.board.history.length === 0 && sameCells(malformedHistory.board.cells, twoStepInitial), 'malformed tutorial history did not fall back to its step start');
      const finalStep = tutorialStepAt(TUTORIAL_STEPS.length - 1);
      const finalInitial = puzzleInitialCells(finalStep);
      const finalHistory = [];
      let finalCells = finalInitial;
      for (const move of finalStep.solution) {
        const after = Array.from(WakeSevenBoardDomain.roll(finalCells, move.triangleIndex, move.direction));
        finalHistory.push({ triangleIndex:move.triangleIndex, direction:move.direction, before:[...finalCells], after });
        finalCells = after;
      }
      const finalTutorial = makeAppStateForNavigation(makeTutorialNavigation(TUTORIAL_STEPS.length - 1), { progress:makeDefaultProgress() });
      finalTutorial.board = { initialCells:[...finalInitial], cells:[...finalCells], history:finalHistory, clearCommitted:false };
      const restoredFinalTutorial = normalizePersistentAppState(finalTutorial);
      checkRuntime('tutorial-final-reload-enters-academy', restoredFinalTutorial.navigation.routeId === 'academy-intro' && restoredFinalTutorial.progress.tutorialCompleted && restoredFinalTutorial.ui.dialog?.type === 'academy-enroll', 'final tutorial reload did not enter academy intro');
      const malformedPuzzleContext = normalizePersistentAppState({ ...midTutorial, navigation:{ ...midTutorial.navigation, puzzleId:'unknown-puzzle' } });
      checkRuntime('malformed-tutorial-context-fallback', malformedPuzzleContext.navigation.tutorialStep === 0 && sameCells(malformedPuzzleContext.board.cells, puzzleInitialCells(tutorialStepAt(0))), 'malformed tutorial context did not fall back safely');
    }

    // 自己検査の実行順。各機能の準備値は関数内へ閉じ、横断検査で必要な値だけ渡す。
    function runSelftest() {
      const errors = [];
      const runtimeChecks = [];
      const checkRuntime = (name, passed, failure) => { runtimeChecks.push(name); if (!passed) errors.push(`${name}: ${failure}`); };
      // 一つの機能で複数の保存・遷移契約を検査する時も、失敗名を一つに潰さない。
      // 自由問題／自作問題などを改修した時、consoleの最初の失敗だけで確認箇所へ戻れる。
      const checkRuntimeEach = (group, contracts) => contracts.forEach(([name, verify, failure]) => {
        try {
          checkRuntime(`${group}:${name}`, Boolean(verify()), failure);
        } catch (error) {
          const detail = error instanceof Error ? error.message : String(error);
          checkRuntime(`${group}:${name}`, false, `${failure}: ${detail}`);
        }
      });
      const core = checkBoardCoreContracts(checkRuntime, errors);
      const academy = checkAcademyContracts(checkRuntime);
      checkTrainingContracts(checkRuntime);
      checkMasteryContracts(checkRuntime);
      checkSpeedContracts(checkRuntime);
      checkSatoriContracts(checkRuntime);
      const free = checkFreeModeContracts(checkRuntimeEach);
      // 自由→自作→自由の往復は、自由の検査で作った同じ途中盤面を使う横断契約。
      checkCustomBoardContracts(checkRuntimeEach, free);
      checkPersistenceContracts(checkRuntime, academy);
      return Object.freeze({ passed:errors.length === 0, errors:Object.freeze(errors), stateCount:WakeSevenBoardDomain.stateCount, ...core, stageReferenceCount:ACADEMY_INTRO_PUZZLES.length + ACADEMY_BASIC_PUZZLES.length + ACADEMY_APPLICATION_PUZZLES.length + ACADEMY_DEVELOPMENT_PUZZLES.length + TRAINING_UPPER_PUZZLES.length + TRAINING_MIDDLE_PUZZLES.length + TRAINING_LOWER_PUZZLES.length + MASTERY_PUZZLES.length + SATORI_PUZZLES.length, tutorialStepCount:TUTORIAL_STEPS.length, symmetryCount:VIEW_SYMMETRIES.length, axisCount:TRIANGLES.length, runtimeChecks:Object.freeze(runtimeChecks) });
    }
    // 起動時に盤面ルールと操作の前提を確認してから表示する
    const selftestResult = runSelftest();
    if (!selftestResult.passed) throw new Error(`board self-test failed: ${selftestResult.errors.slice(0, 3).join('; ')}`);
    boardElement.dataset.selftest = 'passed';
    boardElement.dataset.checkedStates = String(selftestResult.stateCount);
    boardElement.dataset.checkedAxes = String(selftestResult.axisCount);
    boardElement.dataset.checkedRenders = `${selftestResult.renderedInitialCells}+${selftestResult.renderedSolvedCells}`;
    boardElement.dataset.checkedRuntime = selftestResult.runtimeChecks.join(',');
    // OPEN-005だけは例外: 応用の0手復元は「見た」状態を保存しないので、完成形見本から再生する。
    if (applicationShouldReplayIntro()) presentApplicationPuzzle({ context:'application zero-move restore' });
    else if (restoredFromStorage || AppState.ui.dialog?.type === 'welcome') renderRuntime({ context:'restore or welcome' });
    else runArrivalEffect();
  </script>
</body>
</html>
