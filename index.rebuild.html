<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>だるまさんを起こして！</title>
  <style>
    /* ページ全体の見た目 */
    :root { --ai:#16283c; --ai2:#1f3752; --washi:#f7eedc; --washi2:#bccdd3; --kin:#c9a54e; --content-max:23.25rem; }
    html { font-size:calc(16px * clamp(1,calc(100vw / 570px),1.5)); max-width:100%; overflow-x:hidden; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; max-width:100%; display:flex; flex-direction:column; align-items:center; padding:1.125rem 0.75rem max(0.75rem,env(safe-area-inset-bottom)); background:var(--ai); background-image:radial-gradient(120% 70% at 50% 0%,var(--ai2) 0%,var(--ai) 62%); color:var(--washi); font-family:"A1 Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif; }
    /* 画面の枠 */
    .w7-shell { position:relative; width:100%; max-width:var(--content-max); }
    .w7-brand-sub { display:flex; align-items:center; justify-content:center; gap:.625rem; margin:0; color:var(--kin); font-size:.625rem; font-weight:750; letter-spacing:.27em; }
    .w7-brand-sub::before,.w7-brand-sub::after { content:""; width:1.875rem; height:1px; background:linear-gradient(90deg,transparent,rgb(201 165 78 / .8)); }
    .w7-brand-sub::after { background:linear-gradient(90deg,rgb(201 165 78 / .8),transparent); }
    .w7-app-title { margin:.4375rem 0 .35rem; text-align:center; font-size:1.3125rem; font-weight:800; letter-spacing:.07em; }
    .w7-stage-label { margin:0 0 .8rem; text-align:center; color:#b9e8f2; font-weight:700; }
    /* 盤面、棒、操作ボタン */
    .w7-board-feature { display:grid; gap:0.625rem; }
    .w7-board-status { display:flex; justify-content:center; gap:1.5rem; min-height:1.75rem; font-weight:700; font-size:1.05rem; font-variant-numeric:tabular-nums; }
    .w7-board-status strong { display:inline-block; min-width:1.25ch; text-align:right; color:#f5d66d; font-size:1.2em; }
    .w7-board-frame { position:relative; width:100%; max-width:var(--content-max); margin:0 auto; }
    .w7-board { display:block; width:100%; height:auto; overflow:visible; touch-action:none; user-select:none; -webkit-user-select:none; cursor:default; }
    .w7-cell { transform-box:view-box; transform-origin:0 0; will-change:transform; transition:opacity .12s ease,filter .12s ease; }
    .w7-cell-hex { fill:var(--washi); stroke:#c0ac88; stroke-width:1.5; }
    .w7-cell--fallen .w7-cell-hex { fill:var(--washi2); stroke:#c0ac88; }
    .w7-cell--standing { filter:brightness(1.04); }
    .w7-cell.is-grabbed .w7-cell-hex { animation:w7-grab-flash .34s cubic-bezier(.18,.8,.24,1); }
    @keyframes w7-grab-flash { 0%,100% { filter:drop-shadow(0 0 0 rgb(98 215 244 / 0)); } 45% { filter:drop-shadow(0 0 10px rgb(98 215 244 / .9)) brightness(1.22); } }
    /* Daruma artwork is authored around local (0,0), the same center as its panel. */
    .w7-daruma { transform-origin:0 0; }
    .w7-axis-pivot { fill:var(--kin); opacity:.72; pointer-events:none; }
    .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; stroke-width:1.25; pointer-events:none; filter:drop-shadow(0 1px 1px rgb(0 0 0 / .25)); }
    /* チュートリアルで次に回す棒。盤面の入力判定は共通のまま、見た目だけを強調する。 */
    .w7-axis-layer [data-axis].w7-tutorial-target .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; stroke-width:1.25; filter:drop-shadow(0 0 5px rgb(98 215 244 / .78)); animation:w7-tutorial-grip-pulse 1.2s ease-in-out infinite; }
    /* 最初の補助では、正解の棒以外を見せない。探索の段階ではこのclassを付けない。 */
    .w7-axis-layer g[data-axis].w7-tutorial-hidden { opacity:0; }
    /* 入門編は「どの棒か」を考える画面。候補外と、誤って消えた棒は描画も入力も外す。 */
    .w7-axis-layer g[data-axis].w7-academy-hidden { opacity:0; pointer-events:none; }
    .w7-axis-layer g[data-axis].w7-academy-fallen { opacity:.55; pointer-events:none; filter:grayscale(1) brightness(.75); }
    .w7-axis-layer g[data-axis].w7-academy-fallen .w7-axis-grip { fill:#8a96a3; stroke:#5b6673; }
    .w7-axis-layer g[data-axis].w7-academy-candidate .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; filter:drop-shadow(0 0 5px rgb(98 215 244 / .68)); }
    @keyframes w7-tutorial-grip-pulse { 50% { opacity:.58; } }
    .w7-board.is-grip-hover { cursor:grab; }
    .w7-board[data-phase="dragging"] { cursor:grabbing; }
    /* 棒はつかんで回転している間と、全員が起きた後には表示しない。 */
    .w7-board:not([data-phase="ready"]) .w7-axis-layer { opacity:0; }
    .w7-board[data-solved="true"] .w7-axis-layer { opacity:0; }
    .w7-board.is-invalid-grab .w7-cell { opacity:.28; filter:saturate(.55) brightness(.62); }
    .w7-board.is-invalid-grab .w7-axis-pivot { opacity:.18; }
    .w7-grip-prompt { position:absolute; z-index:2; inset:0; display:grid; place-items:center; pointer-events:none; padding:2.5rem 1.25rem; text-align:center; }
    /* 旧チュートリアルと同じく、回す三枚を隠さないよう案内は盤面上側へ置く。 */
    body.w7-tutorial-mode .w7-grip-prompt { place-items:start center; padding:0.75rem 1.25rem 0; }
    .w7-grip-prompt[hidden] { display:none; }
    .w7-grip-prompt span { display:block; padding:.6rem .8rem; border:1px solid rgb(98 215 244 / .66); border-radius:.4rem; background:rgb(22 40 60 / .86); color:#b9e8f2; font-size:clamp(1rem,4vw,1.25rem); font-weight:800; line-height:1.35; box-shadow:0 4px 18px rgb(0 0 0 / .28); }
    .w7-academy-callout { position:absolute; z-index:11; inset:0; display:grid; place-items:center; pointer-events:none; opacity:0; transition:opacity .22s ease; }
    .w7-academy-callout[hidden] { display:none; }
    .w7-academy-callout.is-visible { opacity:1; }
    .w7-academy-callout-badge { display:inline-flex; align-items:center; gap:.25rem; padding:.85rem 1.25rem .8rem; border:2px solid #29a8ce; border-radius:999px; background:rgb(15 35 52 / .85); box-shadow:0 5px 20px rgb(0 0 0 / .34); }
    .w7-academy-callout-label,.w7-academy-callout-unit { color:#9bcBDD; font-size:1.18rem; font-weight:700; transform:translateY(.35rem); }
    .w7-academy-callout-number { color:#62b8d2; font-size:3.75rem; font-weight:750; line-height:1; text-shadow:0 0 10px rgb(98 184 210 / .24); }
    /* 指定方向を伝える、旧版と同じ水色／白縁の弧。盤面の入力とは独立した表示だけのSVG。 */
    .w7-tutorial-arrow { pointer-events:none; }
    .w7-tutorial-arrow .w7-arrow-border { fill:none; stroke:#bff0ff; stroke-width:8.5; stroke-linecap:round; }
    .w7-tutorial-arrow .w7-arrow-line { fill:none; stroke:#62b8d2; stroke-width:5.5; stroke-linecap:round; filter:drop-shadow(0 0 3px rgb(22 40 60 / .9)); }
    .w7-tutorial-arrow .w7-arrow-head { fill:#62b8d2; stroke:#bff0ff; stroke-width:1.5; stroke-linejoin:round; animation:w7-tutorial-grip-pulse 1.2s ease-in-out infinite; }
    .w7-board-controls { display:flex; justify-content:center; gap:0.75rem; }
    .w7-board-controls[hidden] { display:none; }
    .w7-board-button { min-width:7rem; min-height:2.75rem; border:1px solid #c0ac88; border-radius:999px; padding:0.55rem 1rem; background:var(--washi); color:#2d2925; font:inherit; font-weight:700; box-shadow:0 2px 0 rgb(0 0 0 / .24); cursor:pointer; }
    .w7-board-button:focus-visible { outline:3px solid #7dd8f5; outline-offset:3px; }
    .w7-board-button:disabled { opacity:.42; cursor:default; box-shadow:none; }
    .w7-debug-reset { display:block; margin:1.1rem auto 0; border:0; background:transparent; color:#9eb4c8; font:inherit; font-size:.78rem; text-decoration:underline; text-underline-offset:.22em; cursor:pointer; }
    /* 旧版のチュートリアル中のリセット位置。学園以降では開発用リンクとして下へ戻す。 */
    body.w7-tutorial-mode .w7-debug-reset { position:absolute; z-index:4; top:-.75rem; right:0; margin:0; min-height:2.125rem; padding:0 .65rem; border:1px solid rgb(98 184 210 / .38); border-radius:999px; background:rgb(22 40 60 / .62); color:#afc3d0; font-size:.75rem; text-decoration:none; }
    .w7-debug-reset:focus-visible { outline:2px solid #7dd8f5; outline-offset:3px; border-radius:.2rem; }
    .w7-clear-burst { pointer-events:none; transform-box:view-box; }
    .w7-dialog-backdrop { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:1rem; background:rgb(4 13 24 / .7); backdrop-filter:blur(4px); }
    .w7-dialog-backdrop[hidden] { display:none; }
    .w7-dialog { position:relative; width:min(100%,22rem); border:2px solid #7dd8f5; border-radius:1rem; padding:1.35rem; background:var(--ai2); color:var(--washi); box-shadow:0 1rem 3rem rgb(0 0 0 / .42); text-align:center; }
    .w7-dialog h2 { margin:0 0 .6rem; font-size:1.55rem; }
    .w7-dialog p { margin:.3rem 0 1rem; line-height:1.55; }
    .w7-clear-stage-context { position:absolute; top:.9rem; right:1rem; margin:0!important; color:#9bcBDD; font-size:.78rem; font-weight:700; line-height:1.2!important; }
    .w7-clear-note { margin:.625rem 0 .75rem!important; padding:.7rem .8rem; border-radius:.25rem; background:rgb(98 184 210 / .1); color:#b9e8f2; font-size:1.08rem; font-weight:700; line-height:1.62!important; text-align:left; white-space:pre-line; }
    .w7-clear-art { display:block; width:min(100%,14rem); height:8rem; margin:.25rem auto .75rem; overflow:visible; }
    .w7-clear-guide-art { width:min(100%,13.5rem); height:auto; max-height:14rem; }
    .w7-clear-quiz { display:grid; gap:.4rem; margin:.75rem 0 1rem; text-align:left; }
    .w7-clear-quiz { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .w7-clear-quiz p { grid-column:1 / -1; margin:0; color:#b9e8f2; font-size:.9rem; font-weight:700; }
    .w7-clear-quiz button { border:1px solid rgb(185 232 242 / .22); border-radius:.45rem; padding:.45rem .6rem; background:rgb(255 255 255 / .04); color:#b9e8f2; font:inherit; font-size:.78rem; font-weight:700; text-align:left; cursor:pointer; }
    .w7-clear-quiz button.is-correct { border-color:#56c7a2; background:rgb(86 199 162 / .14); }
    .w7-clear-quiz button.is-wrong { border-color:#df6c61; background:rgb(223 108 97 / .13); }
    .w7-clear-quiz-note { min-height:1.4rem!important; color:#b9c6d6!important; font-size:.78rem!important; font-weight:600!important; }
    .w7-clear-quiz.is-success { position:relative; }
    .w7-clear-quiz.is-success::before,.w7-clear-quiz.is-success::after { position:absolute; z-index:2; color:#f2d77a; font-size:1.125rem; line-height:1; opacity:0; pointer-events:none; animation:w7-quiz-spark .7s cubic-bezier(.18,.8,.24,1) both; }
    .w7-clear-quiz.is-success::before { content:"✦"; top:24%; left:7%; }
    .w7-clear-quiz.is-success::after { content:"✧"; top:14%; right:8%; animation-delay:.09s; }
    .w7-clear-quiz.is-success button.is-correct { animation:w7-quiz-correct-pop .48s cubic-bezier(.18,.9,.25,1) both; }
    @keyframes w7-quiz-correct-pop { 0% { transform:scale(.92); filter:brightness(.9); } 55% { transform:scale(1.045); filter:brightness(1.32); } 100% { transform:scale(1); filter:brightness(1); } }
    @keyframes w7-quiz-spark { 0% { transform:translateY(8px) scale(.35) rotate(-18deg); opacity:0; } 28% { opacity:1; } 100% { transform:translateY(-19px) scale(1.15) rotate(14deg); opacity:0; } }
    .w7-dialog-actions { display:flex; justify-content:center; gap:.65rem; flex-wrap:wrap; }
    .w7-dialog--clear h2 { margin-top:.4rem; }
    .w7-dialog-next,.w7-dialog-default { border-color:var(--kin); background:var(--kin); color:var(--ai); }
    /* 導入ダイアログは、本文だけでなく旧版と同じ七枚の見本を見せる。 */
    .w7-dialog--welcome { width:min(100%,22.5rem); padding:1.375rem 1.25rem; border:2px solid #7dd8f5; border-radius:1rem; background:var(--ai2); box-shadow:0 1rem 3rem rgb(0 0 0 / .42); }
    .w7-dialog--welcome h2 { margin-bottom:.875rem; font-size:1.3125rem; letter-spacing:.08em; }
    .w7-dialog--welcome p { margin-top:.5625rem; color:#a8b6c7; font-size:1.0625rem; line-height:1.6; }
    .w7-academy-intro-message { color:var(--kin)!important; font-size:1.25rem!important; font-weight:800; }
    .w7-welcome-board { display:block; width:min(100%,16.25rem); height:auto; margin:.5rem auto -.125rem; transition:opacity .18s ease; }
    .w7-academy-intro-preview { width:calc(100% + 1rem); max-width:none; margin:.35rem -.5rem .8rem; padding:.08rem .7rem .35rem; border:1px solid rgb(125 216 245 / .58); border-radius:.7rem; background:rgb(22 40 60 / .28); }
    .w7-welcome-board.w7-welcome-cycle-fade { opacity:0; }
    .w7-dialog--welcome .w7-board-button { min-height:3.1rem; padding:.875rem 2rem; font-size:1.1875rem; }
    .w7-dialog--welcome .w7-board-button { border-color:var(--kin); background:var(--kin); color:var(--ai); box-shadow:none; }
    .w7-dialog--welcome .w7-dialog-actions { margin-top:.55rem; }
    .w7-dialog--enroll h2 { margin:.15rem 0 .55rem; color:var(--washi); font-size:clamp(1.05rem,5vw,1.35rem); letter-spacing:0; white-space:nowrap; }
    .w7-enroll-art { display:block; width:min(100%,12.75rem); height:auto; max-height:14.75rem; margin:.7rem auto .85rem; }
    .w7-welcome-swipe { fill:#62b8d2; filter:drop-shadow(0 0 3px rgb(98 184 210 / .8)); }
    /* 数字をtransformで拡大するとSVG上で横へ跳ねるため、文字サイズだけを短く弾ませる。 */
    .w7-welcome-counter-pulse { animation:w7-welcome-counter-pulse .34s cubic-bezier(.2,.8,.25,1); }
    @keyframes w7-welcome-counter-pulse { 0%,100% { font-size:var(--w7-counter-size); filter:drop-shadow(0 0 2px rgb(98 184 210 / .2)); } 52% { font-size:calc(var(--w7-counter-size) + 10px); filter:drop-shadow(0 0 8px rgb(98 184 210 / .72)); } }
    /* 旧版のチュートリアルは盤面だけを見せる。手数HUDや問題番号はここに出さない。 */
    body.w7-tutorial-mode .w7-stage-label,body.w7-tutorial-mode .w7-board-status { display:none; }
    body.w7-academy-mode .w7-board-status span:first-child,body.w7-academy-mode .w7-board-controls { display:none; }
    body.w7-academy-mode .w7-board-status { min-height:4.75rem; align-items:center; color:#9bcBDD; font-size:1.18rem; }
    body.w7-academy-mode .w7-board-status span:last-child { display:inline-flex; align-items:baseline; gap:.2rem; }
    body.w7-academy-mode #w7-board-remaining { min-width:auto; color:#62b8d2; font-size:4rem; line-height:.8; transform:translateY(.14rem); text-shadow:0 0 10px rgb(98 184 210 / .24); }
    body.w7-academy-mode #w7-academy-clear-suffix { color:var(--washi); font-size:.92em; }
    body.w7-tutorial-mode .w7-board-feature { gap:0; }
    body.w7-tutorial-mode .w7-board-frame { margin-top:.75rem; }
    body.w7-tutorial-mode .w7-board { margin-top:2.5rem; }
    @media (prefers-reduced-motion:reduce) { .w7-board * { animation:none!important; transition:none!important; } }
    /* スマホでは盤面を横いっぱいに使う */
    @media (max-width:480px) { body { padding-left:0.25rem; padding-right:0.25rem; padding-bottom:max(0.5rem,env(safe-area-inset-bottom)); } .w7-shell,.w7-board-frame { max-width:none; } }
  </style>
</head>
<body>
  <!-- 盤面の画面 -->
  <main class="w7-shell">
    <p class="w7-brand-sub">WAKE SEVEN</p>
    <h1 class="w7-app-title">だるまさんを起こして！</h1>
    <p id="w7-stage-label" class="w7-stage-label">通常問題 1 / 2</p>
    <section class="w7-board-feature" aria-label="七枚のだるま盤">
      <div class="w7-board-status" aria-live="polite">
        <span>いま <strong id="w7-board-moves">0</strong> くるり</span>
        <span>あと <strong id="w7-board-remaining">1</strong> くるり<span id="w7-academy-clear-suffix" hidden> でクリア</span></span>
      </div>
      <div class="w7-board-frame">
        <svg id="w7-board" class="w7-board" viewBox="14 0 293 310" role="img" aria-label="七枚のだるま盤"></svg>
        <div id="w7-grip-prompt" class="w7-grip-prompt" hidden><span>水色の棒をつかんで回そう</span></div>
        <div id="w7-academy-callout" class="w7-academy-callout" hidden><span class="w7-academy-callout-badge"><span class="w7-academy-callout-label">あと</span><strong id="w7-academy-callout-number" class="w7-academy-callout-number">2</strong><span class="w7-academy-callout-unit">くるり</span></span></div>
      </div>
      <div class="w7-board-controls" aria-label="盤面の操作">
        <button id="w7-board-undo" class="w7-board-button" type="button" data-w7-action="undo">一手戻す</button>
        <button id="w7-board-restart" class="w7-board-button" type="button" data-w7-action="restart">やり直す</button>
      </div>
    </section>
    <button id="w7-debug-reset" class="w7-debug-reset" type="button">デバッグ：チュートリアルを最初から</button>
  </main>
  <div id="w7-dialog-backdrop" class="w7-dialog-backdrop" hidden>
    <section id="w7-dialog" class="w7-dialog" role="dialog" aria-modal="true" aria-labelledby="w7-dialog-title" tabindex="-1"></section>
  </div>
  <!-- だるまのSVG部品。盤面描画からuseして使う。 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="w7-daruma-body">
      <path d="M0 -34C17 -34 31 -18 31 4C31 24 18 36 0 36C-18 36 -31 24 -31 4C-31 -18 -17 -34 0 -34Z" fill="var(--daruma-body, #C8352C)"/>
      <path d="M0 -34C17 -34 31 -18 31 4C31 24 18 36 0 36C-18 36 -31 24 -31 4C-31 -18 -17 -34 0 -34Z" fill="none" stroke="#241D1A" stroke-width="2.4"/>
      <ellipse cx="0" cy="-6" rx="19" ry="18" fill="#F3E8D5" stroke="#241D1A" stroke-width="1.9"/>
      <path d="M-15 22C-8 28 8 28 15 22" stroke="var(--daruma-accent, #C9A54E)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
    <g id="w7-face-open">
      <path d="M-13 -14C-11 -17 -6 -17 -4 -14M4 -14C6 -17 11 -17 13 -14" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="-8" cy="-5" r="3.7" fill="#241D1A"/><circle cx="8" cy="-5" r="3.7" fill="#241D1A"/>
      <circle cx="-9.2" cy="-6.2" r="1.2" fill="#F3E8D5"/><circle cx="6.8" cy="-6.2" r="1.2" fill="#F3E8D5"/>
      <circle cx="-15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/><circle cx="15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/>
      <path d="M-5 5C-3 8 3 8 5 5" stroke="#241D1A" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <g id="w7-face-shut">
      <path d="M-13 -13C-11 -15 -6 -15 -4 -13M4 -13C6 -15 11 -15 13 -13" stroke="#241D1A" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".7"/>
      <path d="M-13 -5C-11 -1 -5 -1 -3 -5M3 -5C5 -1 11 -1 13 -5" stroke="#241D1A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <circle cx="-15" cy="3" r="4.4" fill="#E2897B" opacity=".32"/><circle cx="15" cy="3" r="4.4" fill="#E2897B" opacity=".32"/>
      <ellipse cx="0" cy="6" rx="3" ry="2.3" fill="#241D1A" opacity=".75"/>
    </g>
    <g id="w7-face-happy">
      <path d="M-13 -14C-11 -17 -6 -17 -4 -14" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M4 -14C6 -17 11 -17 13 -14" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M-13 -4Q-8 -11 -3 -4" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M3 -4Q8 -11 13 -4" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="-15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/><circle cx="15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/>
      <path d="M-5 5C-3 8 3 8 5 5" stroke="#241D1A" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </defs></svg>

  <script type="module">

      const allGripRegionsMatch = TRIANGLES.every((triangle, triangleIndex) => {
        const geometry = axisGeometry(triangle);
        return hitTestGrip(gripPoint(geometry, 0))?.triangleIndex === triangleIndex
          && hitTestGrip(gripPoint(geometry, -27))?.triangleIndex === triangleIndex
          && hitTestGrip(gripPoint(geometry, -29)) === null
          && hitTestGrip(gripPoint(geometry, 33))?.triangleIndex === triangleIndex
          && hitTestGrip(gripPoint(geometry, 35)) === null
          && hitTestGrip(gripPoint(geometry, 0, 39))?.triangleIndex === triangleIndex
          && hitTestGrip(gripPoint(geometry, 0, 41)) === null;
      });
      checkRuntime('all-grip-regions', allGripRegionsMatch, 'one or more grip hit regions mismatched');
      let settledFramesMatch = true;
      let cancelledFramesMatch = true;
      TRIANGLES.forEach((triangle, triangleIndex) => [1, -1].forEach(direction => {
        const rolled = rollBoardTurns(INITIAL_BOARD, triangleIndex, direction);
        triangle.cells.forEach(cellIndex => {
          const destinationIndex = rotateTriangleCellIndex(triangle, cellIndex, direction);
          const expectedPoint = viewPoint(CELL_POSITIONS[destinationIndex]);
          const settled = rotationFrameForCell(INITIAL_BOARD, triangleIndex, cellIndex, direction * TURN_DEGREES, direction, direction);
          settledFramesMatch &&= Math.hypot(settled.point.x - expectedPoint.x, settled.point.y - expectedPoint.y) < .0001
            && settled.darumaOrientation === rolled[destinationIndex]
            && settled.atSettledPosition
            && !settled.transform.includes(' rotate(');
          const originalPoint = viewPoint(CELL_POSITIONS[cellIndex]);
          const cancelled = rotationFrameForCell(INITIAL_BOARD, triangleIndex, cellIndex, 0, 0, 0);
          cancelledFramesMatch &&= Math.hypot(cancelled.point.x - originalPoint.x, cancelled.point.y - originalPoint.y) < .0001
            && cancelled.darumaOrientation === INITIAL_BOARD[cellIndex]
            && cancelled.atSettledPosition
            && !cancelled.transform.includes(' rotate(');
        });
      }));
      checkRuntime('settled-frame-alignment', settledFramesMatch, 'rotation final frame differs from canonical board');
      checkRuntime('cancelled-frame-alignment', cancelledFramesMatch, 'cancelled rotation final frame differs from canonical board');
      const wakeCells = Uint8Array.from(SOLVED_BOARD);
      const wakeCellIndex = TRIANGLES[0].cells[0];
      wakeCells[wakeCellIndex] = 2;
      const wakesAtDegrees = TURN_DEGREES - DARUMA_UPRIGHT_WINDOW_DEGREES;
      checkRuntime('wake-angle-window', DARUMA_UPRIGHT_WINDOW_DEGREES === 22 && !rotationFrameForCell(wakeCells, 0, wakeCellIndex, wakesAtDegrees - 1).standing && rotationFrameForCell(wakeCells, 0, wakeCellIndex, wakesAtDegrees).standing, 'daruma wake angle window changed');
      const happyPaths = Array.from(document.querySelectorAll('#w7-face-happy path')).map(path => path.getAttribute('d'));
      checkRuntime('clear-face-asset', happyPaths.join('|') === 'M-13 -14C-11 -17 -6 -17 -4 -14|M4 -14C6 -17 11 -17 13 -14|M-13 -4Q-8 -11 -3 -4|M3 -4Q8 -11 13 -4|M-5 5C-3 8 3 8 5 5', 'clear face asset mismatch');
      const applySolution = (puzzle, solution) => solution.reduce((cells, move) => WakeSevenBoardDomain.roll(cells, move.triangleIndex, move.direction), Uint8Array.from(puzzleInitialCells(puzzle)));
      const tutorialCatalogValid = TUTORIAL_STEPS.length === 5 && TUTORIAL_STEPS.every(step => {
        const before = puzzleInitialCells(step);
        let cells = Uint8Array.from(before);
        return SOLVER.distance[step.state] === step.par && step.solution.length === step.par && step.solution.every(move => {
          const beforeDistance = selectDistance(cells);
          cells = WakeSevenBoardDomain.roll(cells, move.triangleIndex, move.direction);
          return beforeDistance !== null && selectDistance(cells) === beforeDistance - 1;
        }) && WakeSevenBoardDomain.isSolved(cells);
      });
      checkRuntime('tutorial-catalog', tutorialCatalogValid, 'tutorial states, par, or explicit solutions are invalid');
      checkRuntime('academy-intro-catalog', ACADEMY_INTRO_PUZZLES.length === 3 && ACADEMY_INTRO_PUZZLES.every(puzzle => SOLVER.distance[puzzle.state] === puzzle.par), 'academy intro catalog is invalid');
      checkRuntime('academy-basic-catalog', ACADEMY_BASIC_PUZZLES.length === 9 && ACADEMY_BASIC_PUZZLES.every(puzzle => SOLVER.distance[puzzle.state] === puzzle.par), 'academy basic catalog is invalid');
      const basicSix = academyBasicPuzzleAt(5);
      const basicSixCells = puzzleInitialCells(basicSix);
      const basicSixCandidates = selectAcademyCandidateTriangles({ puzzle:basicSix, cells:basicSixCells, historyLength:0 });
      checkRuntime('academy-basic-six-top-right', basicSix.preferredTriangle === 2 && basicSixCandidates.includes(2), 'basic six no longer starts with the top-right teaching rod');
      const basicThree = academyBasicPuzzleAt(2);
      const basicThreeCells = puzzleInitialCells(basicThree);
      const basicThreeReducing = new Set(academyReducingTriangles(basicThreeCells).map(candidate => candidate.triangleIndex));
      const basicThreeCandidates = selectAcademyCandidateTriangles({ puzzle:basicThree, cells:basicThreeCells, historyLength:0 });
      checkRuntime('academy-candidate-learning-order', basicThreeCandidates[0] !== undefined && basicThreeCandidates.slice(1).some(index => !basicThreeReducing.has(index)), 'academy candidates no longer include a safely-wrong rod before fallback solutions');
      checkRuntime('academy-guided-rewind', academyGuidedRewindPath(300).end === 360 && academyGuidedRewindPath(-300).end === -360 && academyGuidedRewindPath(410).start === 50 && academyGuidedRewindPath(410).end === 0, 'academy wrong-move rewind path changed');
      const academyPuzzle = academyIntroPuzzleAt(0);
      const academyInitial = puzzleInitialCells(academyPuzzle);
      const academySolution = [{ triangleIndex:0, direction:-1 }];
      const academySolved = Array.from(applySolution(academyPuzzle, academySolution));
      const academyClear = makeAppStateForNavigation(makeAcademyIntroNavigation(), { progress:{ tutorialCompleted:true, completedPuzzleIds:[] } });
      academyClear.board = { initialCells:[...academyInitial], cells:academySolved, history:[{ ...academySolution[0], before:[...academyInitial], after:academySolved }], clearCommitted:false };
      const restoredAcademyClear = normalizePersistentAppState(academyClear);
      checkRuntime('academy-clear-reload', restoredAcademyClear.board.clearCommitted && restoredAcademyClear.ui.dialog?.type === 'clear' && restoredAcademyClear.progress.completedPuzzleIds.includes(academyPuzzle.puzzleId), 'academy clear reload did not rebuild stable dialog');
      const preservedProgress = TUTORIAL_STEPS[0].puzzleId;
      const brokenBoard = normalizePersistentAppState({ ...academyClear, board:{ ...academyClear.board, cells:[9, 9, 9] }, progress:{ tutorialCompleted:true, completedPuzzleIds:[preservedProgress] }, rewards:{ masterGoldGranted:true, satoriDesignGranted:false }, settings:{ theme:'gold', layout:'satori-tilted' } });
      checkRuntime('broken-board-keeps-independent-state', sameCells(brokenBoard.board.cells, academyInitial) && brokenBoard.progress.completedPuzzleIds.includes(preservedProgress) && brokenBoard.settings.theme === 'gold' && brokenBoard.settings.layout === 'standard', 'broken board fallback changed independent progress or reward settings');
      const lockedRewardSettings = normalizePersistentAppState({ ...makeDefaultAppState(), settings:{ theme:'gold', layout:'satori-tilted', themeChosen:true, layoutChosen:true } });
      checkRuntime('locked-reward-selection-fallback', lockedRewardSettings.settings.theme === 'standard' && lockedRewardSettings.settings.layout === 'standard', 'locked reward selection was not normalized');
      const zeroMoveRestore = normalizePersistentAppState(makeDefaultAppState());
      checkRuntime('tutorial-zero-move-reload', zeroMoveRestore.navigation.mode === 'tutorial' && zeroMoveRestore.navigation.tutorialStep === 0 && zeroMoveRestore.board.history.length === 0 && sameCells(zeroMoveRestore.board.cells, puzzleInitialCells(tutorialStepAt(0))), 'tutorial zero-move reload changed the board');
      const twoStep = tutorialStepAt(3);
      const twoStepInitial = puzzleInitialCells(twoStep);
      const firstMove = twoStep.solution[0];
      const secondMove = twoStep.solution[1];
      const afterOneMove = Array.from(WakeSevenBoardDomain.roll(twoStepInitial, firstMove.triangleIndex, firstMove.direction));
      const afterTwoMoves = Array.from(WakeSevenBoardDomain.roll(afterOneMove, secondMove.triangleIndex, secondMove.direction));
      const firstHistoryEntry = { triangleIndex:firstMove.triangleIndex, direction:firstMove.direction, before:[...twoStepInitial], after:afterOneMove };
      const secondHistoryEntry = { triangleIndex:secondMove.triangleIndex, direction:secondMove.direction, before:afterOneMove, after:afterTwoMoves };
      const midTutorial = makeAppStateForNavigation(makeTutorialNavigation(3), { progress:makeDefaultProgress() });
      midTutorial.board = { initialCells:[...twoStepInitial], cells:afterOneMove, history:[firstHistoryEntry], clearCommitted:false };
      const restoredMidTutorial = normalizePersistentAppState(midTutorial);
      checkRuntime('tutorial-one-move-reload', restoredMidTutorial.navigation.tutorialStep === 3 && restoredMidTutorial.board.history.length === 1 && sameCells(restoredMidTutorial.board.cells, afterOneMove), 'tutorial one-move reload did not preserve its stable board');
      const solvedTutorial = { ...midTutorial, board:{ initialCells:[...twoStepInitial], cells:afterTwoMoves, history:[firstHistoryEntry, secondHistoryEntry], clearCommitted:false } };
      const restoredSolvedTutorial = normalizePersistentAppState(solvedTutorial);
      checkRuntime('tutorial-solved-reload-advances', restoredSolvedTutorial.navigation.tutorialStep === 4 && restoredSolvedTutorial.board.history.length === 0 && !restoredSolvedTutorial.board.clearCommitted, 'solved tutorial reload did not advance to the next stable step');
      const malformedHistory = normalizePersistentAppState({ ...midTutorial, board:{ ...midTutorial.board, history:[{ ...firstHistoryEntry, before:[...twoStepInitial.map(() => 0)] }] } });
      checkRuntime('tutorial-malformed-history-fallback', malformedHistory.navigation.tutorialStep === 3 && malformedHistory.board.history.length === 0 && sameCells(malformedHistory.board.cells, twoStepInitial), 'malformed tutorial history did not fall back to its step start');
      const finalStep = tutorialStepAt(TUTORIAL_STEPS.length - 1);
      const finalInitial = puzzleInitialCells(finalStep);
      const finalHistory = [];
      let finalCells = finalInitial;
      for (const move of finalStep.solution) {
        const after = Array.from(WakeSevenBoardDomain.roll(finalCells, move.triangleIndex, move.direction));
        finalHistory.push({ triangleIndex:move.triangleIndex, direction:move.direction, before:[...finalCells], after });
        finalCells = after;
      }
      const finalTutorial = makeAppStateForNavigation(makeTutorialNavigation(TUTORIAL_STEPS.length - 1), { progress:makeDefaultProgress() });
      finalTutorial.board = { initialCells:[...finalInitial], cells:[...finalCells], history:finalHistory, clearCommitted:false };
      const restoredFinalTutorial = normalizePersistentAppState(finalTutorial);
      checkRuntime('tutorial-final-reload-enters-academy', restoredFinalTutorial.navigation.routeId === 'academy-intro' && restoredFinalTutorial.progress.tutorialCompleted && restoredFinalTutorial.ui.dialog?.type === 'academy-enroll', 'final tutorial reload did not enter academy intro');
      const malformedPuzzleContext = normalizePersistentAppState({ ...midTutorial, navigation:{ ...midTutorial.navigation, puzzleId:'unknown-puzzle' } });
      checkRuntime('malformed-tutorial-context-fallback', malformedPuzzleContext.navigation.tutorialStep === 0 && sameCells(malformedPuzzleContext.board.cells, puzzleInitialCells(tutorialStepAt(0))), 'malformed tutorial context did not fall back safely');
      return Object.freeze({ passed:errors.length === 0, errors:Object.freeze(errors), stateCount:WakeSevenBoardDomain.stateCount, reachableCount:seen.size, distanceDistribution:Object.freeze(distribution), stageReferenceCount:ACADEMY_INTRO_PUZZLES.length + ACADEMY_BASIC_PUZZLES.length, tutorialStepCount:TUTORIAL_STEPS.length, symmetryCount:VIEW_SYMMETRIES.length, initialDistance, renderedInitialCells:initialCells.length, renderedSolvedCells:solvedCells.length, axisCount:TRIANGLES.length, runtimeChecks:Object.freeze(runtimeChecks) });
    }
    // 起動時に盤面ルールと操作の前提を確認してから表示する
    const selftestResult = runSelftest();
    if (!selftestResult.passed) throw new Error(`board self-test failed: ${selftestResult.errors.slice(0, 3).join('; ')}`);
    boardElement.dataset.selftest = 'passed';
    boardElement.dataset.checkedStates = String(selftestResult.stateCount);
    boardElement.dataset.checkedAxes = String(selftestResult.axisCount);
    boardElement.dataset.checkedRenders = `${selftestResult.renderedInitialCells}+${selftestResult.renderedSolvedCells}`;
    boardElement.dataset.checkedRuntime = selftestResult.runtimeChecks.join(',');
    // 復元時と初回導入は途中演出を再生せず、安定盤面とダイアログをそのまま出す。
    if (restoredFromStorage || AppState.ui.dialog?.type === 'welcome') renderRuntime({ context:'restore or welcome' });
    else runArrivalEffect();
  </script>
