<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>だるまさんを起こして！</title>
  <style>
    /* WAKE7:CSS:ROOT:START | WAKE7:CSS:FEATURE-BOARD:DEPENDENCIES */
    :root { --ai:#16283c; --ai2:#1f3752; --washi:#f7eedc; --washi2:#bccdd3; --kin:#c9a54e; --content-max:23.25rem; }
    html { font-size:calc(16px * clamp(1,calc(100vw / 570px),1.5)); max-width:100%; overflow-x:hidden; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; max-width:100%; display:flex; flex-direction:column; align-items:center; padding:1.125rem 0.75rem max(0.75rem,env(safe-area-inset-bottom)); background:var(--ai); background-image:radial-gradient(120% 70% at 50% 0%,var(--ai2) 0%,var(--ai) 62%); color:var(--washi); font-family:"A1 Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif; }
    /* WAKE7:CSS:ROOT:END */

    /* WAKE7:CSS:SHELL:START | WAKE7:CSS:FEATURE-BOARD:DEPENDENCIES */
    .w7-shell { width:100%; max-width:var(--content-max); }
    /* WAKE7:CSS:SHELL:END */

    /* WAKE7:CSS:FEATURE-BOARD:START */
    /* SPEC: BOARD-001 BOARD-002 BOARD-003 BOARD-004 ASYNC-001 */
    .w7-board-feature { display:grid; gap:0.625rem; }
    .w7-board-status { display:flex; justify-content:center; gap:1.5rem; min-height:1.75rem; font-weight:700; font-size:1.05rem; font-variant-numeric:tabular-nums; }
    .w7-board-status strong { display:inline-block; min-width:1.25ch; text-align:right; color:#f5d66d; font-size:1.2em; }
    .w7-board-frame { position:relative; width:100%; max-width:var(--content-max); margin:0 auto; }
    .w7-board { display:block; width:100%; height:auto; overflow:visible; touch-action:none; user-select:none; -webkit-user-select:none; }
    .w7-cell-hex { fill:var(--washi); stroke:#c0ac88; stroke-width:1.5; }
    .w7-cell--fallen .w7-cell-hex { fill:var(--washi2); stroke:#c0ac88; }
    .w7-cell--standing { filter:brightness(1.04); }
    .w7-cell--dragging .w7-cell-hex { stroke:#8b43ef; stroke-width:4; }
    .w7-daruma { transform-box:fill-box; transform-origin:center; }
    .w7-axis-pivot { fill:var(--kin); opacity:.72; pointer-events:none; }
    .w7-axis-grip { fill:#7dd8f5; stroke:#3e9bc2; stroke-width:1.25; pointer-events:none; filter:drop-shadow(0 1px 1px rgb(0 0 0 / .25)); }
    .w7-board[data-phase="ready"] { cursor:grab; }
    .w7-board[data-phase="dragging"] { cursor:grabbing; }
    .w7-board:not([data-phase="ready"]):not([data-phase="dragging"]) .w7-axis-layer { opacity:0; }
    .w7-board-controls { display:flex; justify-content:center; gap:0.75rem; }
    .w7-board-button { min-width:7rem; min-height:2.75rem; border:1px solid #c0ac88; border-radius:999px; padding:0.55rem 1rem; background:var(--washi); color:#2d2925; font:inherit; font-weight:700; box-shadow:0 2px 0 rgb(0 0 0 / .24); cursor:pointer; }
    .w7-board-button:focus-visible { outline:3px solid #7dd8f5; outline-offset:3px; }
    .w7-board-button:disabled { opacity:.42; cursor:default; box-shadow:none; }
    .w7-clear-ring { fill:none; stroke:#f5d66d; stroke-width:4; opacity:0; pointer-events:none; }
    @media (prefers-reduced-motion:reduce) { .w7-board * { animation:none!important; transition:none!important; } }
    /* WAKE7:CSS:FEATURE-BOARD:END */
    /* WAKE7:CSS:FEATURE-BOARD:RESPONSIVE */ @media (max-width:480px) { body { padding-left:0.25rem; padding-right:0.25rem; padding-bottom:max(0.5rem,env(safe-area-inset-bottom)); } .w7-shell,.w7-board-frame { max-width:none; } }
  </style>
</head>
<body>
  <!-- WAKE7:DOM:FEATURE-BOARD:START -->
  <!-- SPEC: BOARD-001 BOARD-002 BOARD-003 BOARD-004 ASYNC-001 — board UI and assets stay in this feature range. -->
  <!-- WAKE7:DOM:SHELL:START -->
  <main class="w7-shell">
    <section class="w7-board-feature" aria-label="七枚のだるま盤">
      <div class="w7-board-status" aria-live="polite">
        <span>いま <strong id="w7-board-moves">0</strong> くるり</span>
        <span>あと <strong id="w7-board-remaining">1</strong> くるり</span>
      </div>
      <div class="w7-board-frame">
        <svg id="w7-board" class="w7-board" viewBox="14 0 293 310" role="img" aria-label="七枚のだるま盤"></svg>
      </div>
      <div class="w7-board-controls" aria-label="盤面の操作">
        <button id="w7-board-undo" class="w7-board-button" type="button" data-w7-action="undo">一手戻す</button>
        <button id="w7-board-restart" class="w7-board-button" type="button" data-w7-action="restart">やり直す</button>
      </div>
    </section>
  </main>
  <!-- WAKE7:DOM:SHELL:END -->
  <!-- WAKE7:DOM:FEATURE-BOARD:SVG-ASSETS:START — copied static board assets, not a second source file. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <g id="w7-daruma-body">
      <path d="M0 -34C17 -34 31 -18 31 4C31 24 18 36 0 36C-18 36 -31 24 -31 4C-31 -18 -17 -34 0 -34Z" fill="var(--daruma-body, #C8352C)"/>
      <path d="M0 -34C17 -34 31 -18 31 4C31 24 18 36 0 36C-18 36 -31 24 -31 4C-31 -18 -17 -34 0 -34Z" fill="none" stroke="#241D1A" stroke-width="2.4"/>
      <ellipse cx="0" cy="-6" rx="19" ry="18" fill="#F3E8D5" stroke="#241D1A" stroke-width="1.9"/>
      <path d="M-15 22C-8 28 8 28 15 22" stroke="var(--daruma-accent, #C9A54E)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
    <g id="w7-face-open">
      <path d="M-13 -14C-11 -17 -6 -17 -4 -14M4 -14C6 -17 11 -17 13 -14" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="-8" cy="-5" r="3.7" fill="#241D1A"/><circle cx="8" cy="-5" r="3.7" fill="#241D1A"/>
      <circle cx="-9.2" cy="-6.2" r="1.2" fill="#F3E8D5"/><circle cx="6.8" cy="-6.2" r="1.2" fill="#F3E8D5"/>
      <circle cx="-15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/><circle cx="15" cy="3" r="4.4" fill="#E2897B" opacity=".5"/>
      <path d="M-5 5C-3 8 3 8 5 5" stroke="#241D1A" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <g id="w7-face-shut">
      <path d="M-13 -13C-11 -15 -6 -15 -4 -13M4 -13C6 -15 11 -15 13 -13" stroke="#241D1A" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".7"/>
      <path d="M-13 -5C-11 -1 -5 -1 -3 -5M3 -5C5 -1 11 -1 13 -5" stroke="#241D1A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <circle cx="-15" cy="3" r="4.4" fill="#E2897B" opacity=".32"/><circle cx="15" cy="3" r="4.4" fill="#E2897B" opacity=".32"/>
      <ellipse cx="0" cy="6" rx="3" ry="2.3" fill="#241D1A" opacity=".75"/>
    </g>
    <g id="w7-face-happy">
      <path d="M-13 -13C-10 -17 -5 -17 -2 -13M2 -13C5 -17 10 -17 13 -13" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M-13 -5C-10 -1 -5 -1 -2 -5M2 -5C5 -1 10 -1 13 -5" stroke="#241D1A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <circle cx="-15" cy="3" r="4.8" fill="#E2897B" opacity=".58"/><circle cx="15" cy="3" r="4.8" fill="#E2897B" opacity=".58"/>
      <path d="M-7 4C-4 11 4 11 7 4" stroke="#241D1A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
  </defs></svg>
  <!-- WAKE7:DOM:FEATURE-BOARD:SVG-ASSETS:END -->
  <!-- WAKE7:DOM:FEATURE-BOARD:END -->

  <script type="module">
    /* WAKE7:AI-MAINTENANCE:START
       Primary goal: an AI changes one feature correctly after one rg search.
       Keep a real feature's data, policy, rendering, input, and verification together.
       Do not add unused feature anchors, placeholder UI, or abstraction-only code.
       Prefer local duplication over hiding a feature flow behind a generic layer.
       WAKE7:AI-MAINTENANCE:END */
    /* WAKE7:JS:FEATURE-BOARD:START */
    /* WAKE7:JS:CONSTANTS:START */
    const CELL_COUNT = 7;
    const CELL_RADIUS = 54;
    const CELL_SPACING_X = Math.sqrt(3) * CELL_RADIUS;
    const CELL_SPACING_Y = 1.5 * CELL_RADIUS;
    const BOARD_ORIGIN = Object.freeze({ x: 66.77, y: 74 });
    const CELL_LAYOUT = Object.freeze([[.5, 0], [1.5, 0], [0, 1], [1, 1], [2, 1], [.5, 2], [1.5, 2]]);
    const CELL_POSITIONS = Object.freeze(CELL_LAYOUT.map(([column, row]) => Object.freeze({
      x: BOARD_ORIGIN.x + column * CELL_SPACING_X,
      y: BOARD_ORIGIN.y + row * CELL_SPACING_Y,
    })));
    const SOLVED_BOARD = Object.freeze([0, 0, 0, 0, 0, 0, 0]);
    const EXPECTED_DISTANCE_DISTRIBUTION = Object.freeze([1, 12, 102, 402, 212]);
    const TURN_DEGREES = 120;
    const DRAG_COMMIT_DEGREES = 60;
    const QUICK_FLICK_DEGREES = 18;
    const QUICK_FLICK_MILLISECONDS = 320;
    const ROTATION_MILLISECONDS = 230;
    const ARRIVAL_MILLISECONDS = 420;
    const RESTART_MILLISECONDS = 280;
    const CLEAR_MILLISECONDS = 720;
    const GRIP_HIT_RANGE = Object.freeze({ inner:20, outer:46, across:36 });
    // Current index.html stage 1. P1/P2 render, operate, and validate this one reference-problem source.
    const REFERENCE_STAGE = Object.freeze({ puzzleId:'stage-001', state:31, par:1 });
    /* WAKE7:JS:CONSTANTS:END */

    /* WAKE7:JS:BOARD-DOMAIN:START */
    /* SPEC: BOARD-001 */
    function makeTriangles(cellPositions) {
      const isNeighbor = (a, b) => Math.abs(Math.hypot(a.x - b.x, a.y - b.y) - CELL_SPACING_X) < 2;
      const triangles = [];
      for (let a = 0; a < CELL_COUNT; a += 1) for (let b = a + 1; b < CELL_COUNT; b += 1) for (let c = b + 1; c < CELL_COUNT; c += 1) {
        if (!isNeighbor(cellPositions[a], cellPositions[b]) || !isNeighbor(cellPositions[b], cellPositions[c]) || !isNeighbor(cellPositions[a], cellPositions[c])) continue;
        const x = (cellPositions[a].x + cellPositions[b].x + cellPositions[c].x) / 3;
        const y = (cellPositions[a].y + cellPositions[b].y + cellPositions[c].y) / 3;
        const cells = [a, b, c].sort((left, right) => Math.atan2(cellPositions[left].y - y, cellPositions[left].x - x) - Math.atan2(cellPositions[right].y - y, cellPositions[right].x - x));
        triangles.push(Object.freeze({ cells: Object.freeze(cells), x, y }));
      }
      return Object.freeze(triangles);
    }

    const TRIANGLES = makeTriangles(CELL_POSITIONS);
    const EXPECTED_AXES = Object.freeze([
      Object.freeze({ cells:'0,1,3', pivot:Object.freeze([160.3007,101]), grip:Object.freeze([160.3007,69]) }),
      Object.freeze({ cells:'0,3,2', pivot:Object.freeze([113.5354,128]), grip:Object.freeze([85.8226,112]) }),
      Object.freeze({ cells:'1,4,3', pivot:Object.freeze([207.0661,128]), grip:Object.freeze([234.7789,112]) }),
      Object.freeze({ cells:'2,3,5', pivot:Object.freeze([113.5354,182]), grip:Object.freeze([85.8226,198]) }),
      Object.freeze({ cells:'3,4,6', pivot:Object.freeze([207.0661,182]), grip:Object.freeze([234.7789,198]) }),
      Object.freeze({ cells:'3,6,5', pivot:Object.freeze([160.3007,209]), grip:Object.freeze([160.3007,241]) }),
    ]);
    function axisGeometry(triangle) {
      const center = CELL_POSITIONS[3];
      const angle = Math.atan2(triangle.y - center.y, triangle.x - center.x);
      return Object.freeze({ pivot:Object.freeze([triangle.x, triangle.y]), grip:Object.freeze([triangle.x + 32 * Math.cos(angle), triangle.y + 32 * Math.sin(angle)]), angle });
    }

    const WakeSevenBoardDomain = Object.freeze({
      cellCount: CELL_COUNT,
      stateCount: 3 ** CELL_COUNT,
      triangles: TRIANGLES,
      encode(cells) {
        let state = 0;
        for (let index = 0; index < CELL_COUNT; index += 1) state += cells[index] * 3 ** index;
        return state;
      },
      decode(state) {
        const cells = new Uint8Array(CELL_COUNT);
        let remaining = state;
        for (let index = 0; index < CELL_COUNT; index += 1) { cells[index] = remaining % 3; remaining = Math.floor(remaining / 3); }
        return cells;
      },
      roll(cells, triangleIndex, direction) {
        if (direction !== 1 && direction !== -1) throw new RangeError('roll direction must be +1 or -1');
        const next = Uint8Array.from(cells);
        const triangle = TRIANGLES[triangleIndex];
        if (!triangle) throw new RangeError('unknown triangle');
        for (let offset = 0; offset < 3; offset += 1) {
          const from = direction > 0 ? triangle.cells[offset] : triangle.cells[(offset + 1) % 3];
          const to = direction > 0 ? triangle.cells[(offset + 1) % 3] : triangle.cells[offset];
          next[to] = (cells[from] + (direction > 0 ? 1 : 2)) % 3;
        }
        return next;
      },
      isSolved(cells) { return Array.from(cells).every(value => value === 0); },
      buildSolver() {
        const distance = new Uint8Array(3 ** CELL_COUNT).fill(255);
        const byDepth = [];
        let frontier = [0];
        distance[0] = 0;
        byDepth.push(frontier);
        let depth = 0;
        while (frontier.length) {
          const next = [];
          for (const state of frontier) {
            const cells = this.decode(state);
            for (let triangleIndex = 0; triangleIndex < TRIANGLES.length; triangleIndex += 1) for (const direction of [1, -1]) {
              const nextState = this.encode(this.roll(cells, triangleIndex, direction));
              if (distance[nextState] === 255) { distance[nextState] = depth + 1; next.push(nextState); }
            }
          }
          if (next.length) byDepth.push(next);
          frontier = next;
          depth += 1;
        }
        return Object.freeze({ distance, byDepth: Object.freeze(byDepth.map(states => Object.freeze(states))) });
      },
    });
    const SOLVER = WakeSevenBoardDomain.buildSolver();
    const INITIAL_BOARD = Object.freeze(Array.from(WakeSevenBoardDomain.decode(REFERENCE_STAGE.state)));
    /* WAKE7:JS:BOARD-DOMAIN:END */

    /* WAKE7:JS:VIEW-TRANSFORM:START */
    /* The board's logic always uses CELL_POSITIONS; this display transform is presentation-only. */
    const BOARD_VIEW = Object.freeze({ rotationDegrees: 0, translateX: 0, translateY: 0 });
    function viewPoint(logicalPoint) {
      const center = CELL_POSITIONS[3];
      const radians = BOARD_VIEW.rotationDegrees * Math.PI / 180;
      const dx = logicalPoint.x - center.x;
      const dy = logicalPoint.y - center.y;
      return Object.freeze({ x: center.x + dx * Math.cos(radians) - dy * Math.sin(radians) + BOARD_VIEW.translateX, y: center.y + dx * Math.sin(radians) + dy * Math.cos(radians) + BOARD_VIEW.translateY });
    }

    // These are logical symmetry transforms, kept separate from the presentation-only BOARD_VIEW above.
    function makeViewPermutation(rotationDegrees = 0, flip = false) {
      const center = CELL_POSITIONS[3];
      const radians = rotationDegrees * Math.PI / 180;
      return Object.freeze(CELL_POSITIONS.map(point => {
        let x = point.x - center.x;
        const y = point.y - center.y;
        if (flip) x = -x;
        const rotated = { x: center.x + x * Math.cos(radians) - y * Math.sin(radians), y: center.y + x * Math.sin(radians) + y * Math.cos(radians) };
        return CELL_POSITIONS.reduce((bestIndex, candidate, index) => Math.hypot(candidate.x - rotated.x, candidate.y - rotated.y) < Math.hypot(CELL_POSITIONS[bestIndex].x - rotated.x, CELL_POSITIONS[bestIndex].y - rotated.y) ? index : bestIndex, 0);
      }));
    }
    const VIEW_SYMMETRIES = Object.freeze(Array.from({ length: 6 }, (_, turn) => Object.freeze([
      Object.freeze({ permutation: makeViewPermutation(turn * 60), flip: false }),
      Object.freeze({ permutation: makeViewPermutation(turn * 60, true), flip: true }),
    ])).flat());
    function transformCellsBySymmetry(cells, symmetry) {
      const transformed = new Uint8Array(CELL_COUNT);
      for (let from = 0; from < CELL_COUNT; from += 1) transformed[symmetry.permutation[from]] = symmetry.flip ? (3 - cells[from]) % 3 : cells[from];
      return transformed;
    }
    /* WAKE7:JS:VIEW-TRANSFORM:END */

    /* WAKE7:JS:UI-RENDER:START */
    /* SPEC: BOARD-001 BOARD-002 BOARD-003 BOARD-004 */
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const boardElement = document.querySelector('#w7-board');
    const boardMovesElement = document.querySelector('#w7-board-moves');
    const boardRemainingElement = document.querySelector('#w7-board-remaining');
    const boardUndoButton = document.querySelector('#w7-board-undo');
    const boardRestartButton = document.querySelector('#w7-board-restart');
    function svgElement(name, attributes = {}) { const element = document.createElementNS(SVG_NS, name); for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value)); return element; }
    function hexPath(radius) { return Array.from({ length: 6 }, (_, index) => { const angle = (90 + index * 60) * Math.PI / 180; return `${index ? 'L' : 'M'}${(radius * Math.cos(angle)).toFixed(2)} ${(radius * -Math.sin(angle)).toFixed(2)}`; }).join(' ') + 'Z'; }
    function orientationDegrees(orientation) { return orientation === 0 ? 0 : orientation === 1 ? TURN_DEGREES : -TURN_DEGREES; }
    function appendDaruma(parent, orientation, happy = false) {
      const group = svgElement('g', { class: 'w7-daruma', transform: `rotate(${orientationDegrees(orientation)})`, 'data-orientation': orientation });
      group.append(svgElement('use', { href: '#w7-daruma-body' }));
      group.append(svgElement('use', { href: happy && orientation === 0 ? '#w7-face-happy' : orientation === 0 ? '#w7-face-open' : '#w7-face-shut' }));
      parent.append(group);
    }
    function appendAxisLayer(target) {
      const layer = svgElement('g', { class: 'w7-axis-layer', 'aria-hidden': 'true' });
      TRIANGLES.forEach((triangle, triangleIndex) => {
        const geometry = axisGeometry(triangle);
        const pivot = viewPoint({ x:geometry.pivot[0], y:geometry.pivot[1] });
        const grip = viewPoint({ x:geometry.grip[0], y:geometry.grip[1] });
        layer.append(svgElement('circle', { class:'w7-axis-pivot', cx:pivot.x, cy:pivot.y, r:4.4, 'data-axis':triangleIndex }));
        const gripGroup = svgElement('g', { transform:`translate(${grip.x} ${grip.y}) rotate(${geometry.angle * 180 / Math.PI + BOARD_VIEW.rotationDegrees})`, 'data-axis':triangleIndex });
        gripGroup.append(svgElement('rect', { class:'w7-axis-grip', x:-18, y:-4, width:36, height:8, rx:4 }));
        layer.append(gripGroup);
      });
      target.append(layer);
    }
    function renderBoard(cells = INITIAL_BOARD, target = boardElement, options = {}) {
      const includeAxes = options.includeAxes ?? target === boardElement;
      target.replaceChildren();
      Array.from(cells).forEach((orientation, index) => {
        const point = viewPoint(CELL_POSITIONS[index]);
        const cell = svgElement('g', { class:`w7-cell ${orientation === 0 ? 'w7-cell--standing' : 'w7-cell--fallen'}`, transform:`translate(${point.x} ${point.y})`, 'data-cell-index':index, 'data-orientation':orientation });
        cell.append(svgElement('path', { class:'w7-cell-hex', d:hexPath(CELL_RADIUS) }));
        appendDaruma(cell, orientation, Boolean(options.happy));
        target.append(cell);
      });
      if (includeAxes) appendAxisLayer(target);
      return target;
    }
    function selectDistance(cells) { const value = SOLVER.distance[WakeSevenBoardDomain.encode(cells)]; return value === 255 ? null : value; }
    function renderBoardStatus(cells = RuntimeState.cells, previewMove = false) {
      boardMovesElement.textContent = String(RuntimeState.history.length + (previewMove ? 1 : 0));
      const distance = selectDistance(cells);
      boardRemainingElement.textContent = distance === null ? '—' : String(distance);
    }
    function renderBoardPhase() {
      boardElement.dataset.phase = RuntimeState.phase;
      boardElement.dataset.state = String(WakeSevenBoardDomain.encode(RuntimeState.cells));
      boardElement.dataset.historyLength = String(RuntimeState.history.length);
      boardElement.dataset.solved = String(WakeSevenBoardDomain.isSolved(RuntimeState.cells));
      const ready = RuntimeState.phase === BoardPhase.READY;
      boardUndoButton.disabled = !ready || RuntimeState.history.length === 0;
      boardRestartButton.disabled = !ready || (RuntimeState.history.length === 0 && WakeSevenBoardDomain.encode(RuntimeState.cells) === REFERENCE_STAGE.state);
    }
    function renderRuntime(options = {}) {
      renderBoard(RuntimeState.cells, boardElement, { happy:Boolean(options.happy) });
      renderBoardStatus();
      renderBoardPhase();
      if (RuntimeState.phase === BoardPhase.READY) assertRuntimeDomAlignment(options.context ?? 'render');
    }
    function normalizedDegrees(degrees) { return ((degrees + 180) % 360 + 360) % 360 - 180; }
    function rotatePoint(point, pivot, degrees) {
      const radians = degrees * Math.PI / 180;
      const dx = point.x - pivot.x;
      const dy = point.y - pivot.y;
      return { x:pivot.x + dx * Math.cos(radians) - dy * Math.sin(radians), y:pivot.y + dx * Math.sin(radians) + dy * Math.cos(radians) };
    }
    function renderRotationPreview(cells, triangleIndex, degrees, previewDirection = 0) {
      renderBoard(cells);
      const triangle = TRIANGLES[triangleIndex];
      const pivot = viewPoint({ x:triangle.x, y:triangle.y });
      triangle.cells.forEach(cellIndex => {
        const cell = boardElement.querySelector(`[data-cell-index="${cellIndex}"]`);
        const start = viewPoint(CELL_POSITIONS[cellIndex]);
        const point = rotatePoint(start, pivot, degrees);
        const visuallyStanding = Math.abs(normalizedDegrees(orientationDegrees(cells[cellIndex]) + degrees)) <= 22;
        cell.setAttribute('transform', `translate(${point.x} ${point.y}) rotate(${degrees})`);
        cell.classList.toggle('w7-cell--standing', visuallyStanding);
        cell.classList.toggle('w7-cell--fallen', !visuallyStanding);
        cell.classList.add('w7-cell--dragging');
      });
      const previewCells = previewDirection ? WakeSevenBoardDomain.roll(cells, triangleIndex, previewDirection) : cells;
      renderBoardStatus(previewCells, Boolean(previewDirection));
      renderBoardPhase();
    }
    /* WAKE7:JS:UI-RENDER:END */

    /* WAKE7:JS:RUNTIME-STATE:START */
    /* SPEC: BOARD-002 BOARD-003 ASYNC-001 — this object is the sole owner of transient board state. */
    const BoardPhase = Object.freeze({ ARRIVING:'arriving', READY:'ready', DRAGGING:'dragging', ROTATING:'rotating', UNDOING:'undoing', RESTARTING:'restarting', CELEBRATING:'celebrating' });
    const RuntimeState = {
      cells: Uint8Array.from(INITIAL_BOARD),
      history: [],
      phase: BoardPhase.READY,
      drag: null,
      effectGeneration: 0,
      activeEffect: null,
    };
    function selectCanStartBoardDrag(state = RuntimeState) { return state.phase === BoardPhase.READY && !WakeSevenBoardDomain.isSolved(state.cells); }
    function selectCanUseHistory(state = RuntimeState) { return state.phase === BoardPhase.READY; }
    function assertRuntimeDomAlignment(context) {
      const cells = Array.from(boardElement.querySelectorAll('.w7-cell'));
      const domOrientations = cells.map(cell => Number(cell.dataset.orientation));
      const aligned = cells.length === CELL_COUNT && domOrientations.every((value, index) => value === RuntimeState.cells[index]);
      const historyAligned = Number(boardElement.dataset.historyLength) === RuntimeState.history.length;
      const stateAligned = Number(boardElement.dataset.state) === WakeSevenBoardDomain.encode(RuntimeState.cells);
      boardElement.dataset.invariant = aligned && historyAligned && stateAligned ? 'passed' : 'failed';
      if (!aligned || !historyAligned || !stateAligned) throw new Error(`board invariant failed after ${context}`);
    }
    function commitBoardMove(triangleIndex, direction) {
      const before = Uint8Array.from(RuntimeState.cells);
      const after = WakeSevenBoardDomain.roll(before, triangleIndex, direction);
      RuntimeState.history.push(Object.freeze({ triangleIndex, direction, before:Object.freeze(Array.from(before)), after:Object.freeze(Array.from(after)) }));
      RuntimeState.cells = after;
    }
    /* WAKE7:JS:RUNTIME-STATE:END */

    /* WAKE7:JS:EFFECT-RUNNER:START */
    /* SPEC: BOARD-004 ASYNC-001 — every asynchronous completion belongs to one generation. */
    function disposeEffectResources(effect) {
      effect.animationFrames.forEach(handle => cancelAnimationFrame(handle));
      effect.timers.forEach(handle => clearTimeout(handle));
      effect.animations.forEach(animation => animation.cancel());
      effect.cleanups.forEach(cleanup => cleanup());
      effect.animationFrames.clear(); effect.timers.clear(); effect.animations.clear(); effect.cleanups.clear();
    }
    function cancelActiveEffect(reason = 'cancelled') {
      const effect = RuntimeState.activeEffect;
      RuntimeState.activeEffect = null;
      RuntimeState.effectGeneration += 1;
      if (effect) { effect.reason = reason; disposeEffectResources(effect); }
      RuntimeState.drag = null;
      RuntimeState.phase = BoardPhase.READY;
    }
    function beginEffect(phase) {
      if (RuntimeState.activeEffect) cancelActiveEffect('superseded');
      const effect = { generation:++RuntimeState.effectGeneration, phase, animationFrames:new Set(), timers:new Set(), animations:new Set(), cleanups:new Set(), reason:'' };
      RuntimeState.activeEffect = effect;
      RuntimeState.phase = phase;
      renderBoardPhase();
      return effect;
    }
    function isCurrentEffect(effect) { return RuntimeState.activeEffect === effect && RuntimeState.effectGeneration === effect.generation; }
    function finishEffect(effect, nextPhase = BoardPhase.READY) {
      if (!isCurrentEffect(effect)) return false;
      RuntimeState.activeEffect = null;
      RuntimeState.phase = nextPhase;
      disposeEffectResources(effect);
      return true;
    }
    function registerEffectCleanup(effect, cleanup) { effect.cleanups.add(cleanup); return () => effect.cleanups.delete(cleanup); }
    function requestEffectFrame(effect, callback) {
      const handle = requestAnimationFrame(timestamp => {
        effect.animationFrames.delete(handle);
        if (isCurrentEffect(effect)) callback(timestamp);
      });
      effect.animationFrames.add(handle);
      return handle;
    }
    function setEffectTimer(effect, callback, milliseconds) {
      const handle = setTimeout(() => {
        effect.timers.delete(handle);
        if (isCurrentEffect(effect)) callback();
      }, milliseconds);
      effect.timers.add(handle);
      return handle;
    }
    function startEffectAnimation(effect, element, keyframes, options) {
      const animation = element.animate(keyframes, options);
      effect.animations.add(animation);
      animation.onfinish = () => effect.animations.delete(animation);
      animation.oncancel = () => effect.animations.delete(animation);
      return animation;
    }
    function runEffectFrames(effect, milliseconds, update, complete) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || milliseconds <= 0) { update(1); if (isCurrentEffect(effect)) complete(); return; }
      let startedAt = null;
      const frame = timestamp => {
        if (startedAt === null) startedAt = timestamp;
        const linear = Math.min(1, (timestamp - startedAt) / milliseconds);
        update(1 - (1 - linear) ** 3);
        if (linear < 1) requestEffectFrame(effect, frame);
        else if (isCurrentEffect(effect)) complete();
      };
      requestEffectFrame(effect, frame);
    }
    /* WAKE7:JS:EFFECT-RUNNER:END */

    /* WAKE7:JS:POINTER-INPUT:START */
    /* SPEC: BOARD-002 — pointer capture, continuous preview, one transactional commit or cancel. */
    function eventToBoardPoint(event) {
      const matrix = boardElement.getScreenCTM();
      if (matrix && typeof DOMPoint === 'function') { const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse()); return { x:point.x, y:point.y }; }
      const bounds = boardElement.getBoundingClientRect();
      return { x:14 + (event.clientX - bounds.left) * 293 / bounds.width, y:(event.clientY - bounds.top) * 310 / bounds.height };
    }
    function hitTestGrip(point) {
      let bestHit = null;
      let bestScore = Infinity;
      TRIANGLES.forEach((triangle, triangleIndex) => {
        const geometry = axisGeometry(triangle);
        const grip = { x:geometry.grip[0], y:geometry.grip[1] };
        const dx = point.x - grip.x;
        const dy = point.y - grip.y;
        const along = dx * Math.cos(geometry.angle) + dy * Math.sin(geometry.angle);
        const across = -dx * Math.sin(geometry.angle) + dy * Math.cos(geometry.angle);
        if (along < -GRIP_HIT_RANGE.inner || along > GRIP_HIT_RANGE.outer || Math.abs(across) > GRIP_HIT_RANGE.across) return;
        const alongRange = along < 0 ? GRIP_HIT_RANGE.inner : GRIP_HIT_RANGE.outer;
        const score = (along / alongRange) ** 2 + (across / GRIP_HIT_RANGE.across) ** 2;
        if (score < bestScore) { bestScore = score; bestHit = { triangleIndex, triangle, geometry }; }
      });
      return bestHit;
    }
    function selectDragDirection(degrees, elapsedMilliseconds = Infinity, allowQuickFlick = false) {
      const magnitude = Math.abs(degrees);
      if (magnitude >= DRAG_COMMIT_DEGREES || allowQuickFlick && magnitude >= QUICK_FLICK_DEGREES && elapsedMilliseconds <= QUICK_FLICK_MILLISECONDS) return degrees >= 0 ? 1 : -1;
      return 0;
    }
    function safelyCapturePointer(pointerId) { try { boardElement.setPointerCapture(pointerId); } catch {} }
    function safelyReleasePointer(pointerId) { try { if (boardElement.hasPointerCapture(pointerId)) boardElement.releasePointerCapture(pointerId); } catch {} }
    function handleBoardPointerDown(event) {
      if (!selectCanStartBoardDrag() || event.pointerType === 'mouse' && event.button !== 0) return;
      const point = eventToBoardPoint(event);
      const hit = hitTestGrip(point);
      if (!hit) return;
      event.preventDefault();
      const effect = beginEffect(BoardPhase.DRAGGING);
      const startAngle = Math.atan2(point.y - hit.triangle.y, point.x - hit.triangle.x);
      RuntimeState.drag = { pointerId:event.pointerId, triangleIndex:hit.triangleIndex, cells:Uint8Array.from(RuntimeState.cells), startedAt:performance.now(), lastAngle:startAngle, degrees:0, effect };
      safelyCapturePointer(event.pointerId);
      registerEffectCleanup(effect, () => safelyReleasePointer(event.pointerId));
      renderRotationPreview(RuntimeState.drag.cells, hit.triangleIndex, 0, 0);
    }
    function handleBoardPointerMove(event) {
      const drag = RuntimeState.drag;
      if (!drag || RuntimeState.phase !== BoardPhase.DRAGGING || drag.pointerId !== event.pointerId) return;
      event.preventDefault();
      const point = eventToBoardPoint(event);
      const triangle = TRIANGLES[drag.triangleIndex];
      const angle = Math.atan2(point.y - triangle.y, point.x - triangle.x);
      const delta = normalizedDegrees((angle - drag.lastAngle) * 180 / Math.PI);
      drag.lastAngle = angle;
      drag.degrees = Math.max(-150, Math.min(150, drag.degrees + delta));
      const previewDirection = selectDragDirection(drag.degrees);
      renderRotationPreview(drag.cells, drag.triangleIndex, drag.degrees, previewDirection);
    }
    function finishBoardDrag(event, cancelled = false) {
      const drag = RuntimeState.drag;
      if (!drag || drag.pointerId !== event.pointerId || !isCurrentEffect(drag.effect)) return;
      event.preventDefault();
      RuntimeState.drag = null;
      safelyReleasePointer(event.pointerId);
      if (cancelled) { cancelActiveEffect('pointercancel'); renderRuntime({ context:'pointercancel' }); return; }
      const elapsed = performance.now() - drag.startedAt;
      const direction = selectDragDirection(drag.degrees, elapsed, true);
      const targetDegrees = direction * TURN_DEGREES;
      RuntimeState.phase = BoardPhase.ROTATING;
      drag.effect.phase = BoardPhase.ROTATING;
      renderBoardPhase();
      const duration = ROTATION_MILLISECONDS * Math.max(.25, Math.abs(targetDegrees - drag.degrees) / TURN_DEGREES);
      runEffectFrames(drag.effect, duration, progress => renderRotationPreview(drag.cells, drag.triangleIndex, drag.degrees + (targetDegrees - drag.degrees) * progress, direction), () => {
        if (direction) commitBoardMove(drag.triangleIndex, direction);
        if (!finishEffect(drag.effect)) return;
        renderRuntime({ context:direction ? 'move commit' : 'short drag cancel' });
        if (direction && WakeSevenBoardDomain.isSolved(RuntimeState.cells)) runClearEffect();
      });
    }
    function handleBoardPointerUp(event) { finishBoardDrag(event, false); }
    function handleBoardPointerCancel(event) { finishBoardDrag(event, true); }
    function handleBoardLostPointerCapture(event) { if (RuntimeState.drag?.pointerId === event.pointerId) finishBoardDrag(event, true); }
    /* WAKE7:JS:POINTER-INPUT:END */

    /* WAKE7:JS:BOARD-COMMANDS:START */
    /* SPEC: BOARD-003 BOARD-004 ASYNC-001 */
    function runArrivalEffect() {
      renderRuntime();
      const effect = beginEffect(BoardPhase.ARRIVING);
      const center = viewPoint(CELL_POSITIONS[3]);
      runEffectFrames(effect, ARRIVAL_MILLISECONDS, progress => {
        boardElement.querySelectorAll('.w7-cell').forEach((cell, index) => {
          const destination = viewPoint(CELL_POSITIONS[index]);
          const x = center.x + (destination.x - center.x) * progress;
          const y = center.y + (destination.y - center.y) * progress;
          cell.setAttribute('transform', `translate(${x} ${y}) scale(${.72 + .28 * progress})`);
          cell.style.opacity = String(progress);
        });
      }, () => { if (finishEffect(effect)) renderRuntime({ context:'arrival' }); });
    }
    function intentUndo() {
      if (!selectCanUseHistory() || RuntimeState.history.length === 0) return false;
      const entry = RuntimeState.history.at(-1);
      const currentCells = Uint8Array.from(RuntimeState.cells);
      const effect = beginEffect(BoardPhase.UNDOING);
      runEffectFrames(effect, ROTATION_MILLISECONDS, progress => renderRotationPreview(currentCells, entry.triangleIndex, -entry.direction * TURN_DEGREES * progress, 0), () => {
        if (!isCurrentEffect(effect) || RuntimeState.history.at(-1) !== entry) return;
        RuntimeState.history.pop();
        RuntimeState.cells = Uint8Array.from(entry.before);
        if (finishEffect(effect)) renderRuntime({ context:'undo' });
      });
      return true;
    }
    function intentRestart() {
      if (!selectCanUseHistory() || RuntimeState.history.length === 0 && WakeSevenBoardDomain.encode(RuntimeState.cells) === REFERENCE_STAGE.state) return false;
      const effect = beginEffect(BoardPhase.RESTARTING);
      runEffectFrames(effect, RESTART_MILLISECONDS, progress => {
        const opacity = 1 - Math.sin(Math.PI * progress) * .62;
        const scale = 1 - Math.sin(Math.PI * progress) * .08;
        boardElement.querySelectorAll('.w7-cell').forEach(cell => { cell.style.opacity = String(opacity); cell.setAttribute('transform', `${cell.getAttribute('transform').replace(/ scale\([^)]*\)$/, '')} scale(${scale})`); });
      }, () => {
        RuntimeState.cells = Uint8Array.from(INITIAL_BOARD);
        RuntimeState.history.length = 0;
        if (finishEffect(effect)) renderRuntime({ context:'restart' });
      });
      return true;
    }
    function runClearEffect() {
      const effect = beginEffect(BoardPhase.CELEBRATING);
      renderRuntime({ happy:true });
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { if (finishEffect(effect)) renderRuntime({ context:'reduced-motion clear' }); return; }
      boardElement.querySelectorAll('.w7-cell').forEach((cell, index) => startEffectAnimation(effect, cell, [{ filter:'brightness(1)' }, { filter:'brightness(1.45)' }, { filter:'brightness(1)' }], { duration:420, delay:index * 28, easing:'ease-out' }));
      const center = viewPoint(CELL_POSITIONS[3]);
      const ring = svgElement('circle', { class:'w7-clear-ring', cx:center.x, cy:center.y, r:32 });
      boardElement.append(ring);
      startEffectAnimation(effect, ring, [{ opacity:0, transform:'scale(.7)' }, { opacity:1, offset:.28 }, { opacity:0, transform:'scale(3.1)' }], { duration:CLEAR_MILLISECONDS, easing:'ease-out' });
      setEffectTimer(effect, () => { if (finishEffect(effect)) renderRuntime({ context:'clear effect' }); }, CLEAR_MILLISECONDS);
    }
    /* WAKE7:JS:BOARD-COMMANDS:END */

    /* WAKE7:JS:EVENT-BINDINGS:START */
    boardElement.addEventListener('pointerdown', handleBoardPointerDown);
    boardElement.addEventListener('pointermove', handleBoardPointerMove);
    boardElement.addEventListener('pointerup', handleBoardPointerUp);
    boardElement.addEventListener('pointercancel', handleBoardPointerCancel);
    boardElement.addEventListener('lostpointercapture', handleBoardLostPointerCapture);
    boardUndoButton.addEventListener('click', intentUndo);
    boardRestartButton.addEventListener('click', intentRestart);
    window.addEventListener('blur', () => { if (RuntimeState.phase === BoardPhase.DRAGGING) { cancelActiveEffect('window blur'); renderRuntime({ context:'window blur' }); } });
    window.addEventListener('pagehide', () => cancelActiveEffect('pagehide'));
    /* WAKE7:JS:EVENT-BINDINGS:END */

    /* WAKE7:JS:DEBUG-SELFTEST:START */
    /* SPEC: BOARD-001 BOARD-002 BOARD-003 BOARD-004 ASYNC-001 — exhaustive domain plus P2 transition contracts. */
    function runSelftest() {
      const errors = [];
      const seen = new Set();
      for (let state = 0; state < WakeSevenBoardDomain.stateCount; state += 1) {
        const decoded = WakeSevenBoardDomain.decode(state);
        if (WakeSevenBoardDomain.encode(decoded) !== state) errors.push(`encode/decode mismatch at ${state}`);
        if (decoded.length !== CELL_COUNT || Array.from(decoded).some(value => value < 0 || value > 2)) errors.push(`invalid decoded cells at ${state}`);
        for (let triangleIndex = 0; triangleIndex < TRIANGLES.length; triangleIndex += 1) {
          const rolled = WakeSevenBoardDomain.roll(decoded, triangleIndex, 1);
          if (rolled.length !== CELL_COUNT || Array.from(rolled).some(value => value < 0 || value > 2)) errors.push(`invalid roll result at ${state}, axis ${triangleIndex}`);
          const restored = WakeSevenBoardDomain.roll(rolled, triangleIndex, -1);
          if (WakeSevenBoardDomain.encode(restored) !== state) errors.push(`inverse roll mismatch at ${state}, axis ${triangleIndex}`);
        }
        if (SOLVER.distance[state] !== 255) seen.add(state);
        if (SOLVER.distance[state] > 0 && SOLVER.distance[state] !== 255 && !TRIANGLES.some((_, triangleIndex) => [1, -1].some(direction => SOLVER.distance[WakeSevenBoardDomain.encode(WakeSevenBoardDomain.roll(decoded, triangleIndex, direction))] === SOLVER.distance[state] - 1))) errors.push(`no distance-reducing roll at ${state}`);
        for (const symmetry of VIEW_SYMMETRIES) {
          const transformedState = WakeSevenBoardDomain.encode(transformCellsBySymmetry(decoded, symmetry));
          if (SOLVER.distance[transformedState] !== SOLVER.distance[state]) errors.push(`view symmetry changed distance at ${state}`);
        }
      }
      const distribution = SOLVER.byDepth.map(states => states.length);
      if (TRIANGLES.length !== 6) errors.push(`expected 6 axes, got ${TRIANGLES.length}`);
      if (TRIANGLES.some(triangle => triangle.cells.length !== 3 || new Set(triangle.cells).size !== 3)) errors.push('axis does not contain three distinct cells');
      TRIANGLES.forEach((triangle, index) => {
        const expected = EXPECTED_AXES[index];
        const geometry = axisGeometry(triangle);
        const close = (actual, reference) => Math.abs(actual - reference) < 0.0001;
        if (!expected || triangle.cells.join(',') !== expected.cells) errors.push(`axis ${index} cells mismatch: ${triangle.cells.join(',')}`);
        if (!expected || !geometry.pivot.every((value, coordinate) => close(value, expected.pivot[coordinate]))) errors.push(`axis ${index} pivot mismatch`);
        if (!expected || !geometry.grip.every((value, coordinate) => close(value, expected.grip[coordinate]))) errors.push(`axis ${index} grip mismatch`);
      });
      if (seen.size !== 729) errors.push(`expected 729 reachable states, got ${seen.size}`);
      if (WakeSevenBoardDomain.stateCount - seen.size !== 1458) errors.push(`expected 1458 unreachable states, got ${WakeSevenBoardDomain.stateCount - seen.size}`);
      if (distribution.join(',') !== EXPECTED_DISTANCE_DISTRIBUTION.join(',')) errors.push(`distance distribution mismatch: ${distribution.join(',')}`);
      if (!WakeSevenBoardDomain.isSolved(SOLVED_BOARD)) errors.push('solved board was not solved');
      if (!Number.isInteger(REFERENCE_STAGE.state) || REFERENCE_STAGE.state < 0 || REFERENCE_STAGE.state >= WakeSevenBoardDomain.stateCount) errors.push(`invalid stage state for ${REFERENCE_STAGE.puzzleId}`);
      else if (SOLVER.distance[REFERENCE_STAGE.state] !== REFERENCE_STAGE.par) errors.push(`stage par mismatch for ${REFERENCE_STAGE.puzzleId}: expected ${REFERENCE_STAGE.par}, got ${SOLVER.distance[REFERENCE_STAGE.state]}`);
      if (VIEW_SYMMETRIES.some(symmetry => new Set(symmetry.permutation).size !== CELL_COUNT)) errors.push('view permutation is not bijective');
      const initialDistance = SOLVER.distance[REFERENCE_STAGE.state];
      if (WakeSevenBoardDomain.encode(INITIAL_BOARD) !== REFERENCE_STAGE.state) errors.push(`initial board does not match ${REFERENCE_STAGE.puzzleId}`);
      const renderProbe = svgElement('svg');
      renderBoard(INITIAL_BOARD, renderProbe);
      const initialCells = Array.from(renderProbe.querySelectorAll('.w7-cell'));
      if (initialCells.length !== CELL_COUNT) errors.push(`initial render expected ${CELL_COUNT} cells, got ${initialCells.length}`);
      if (initialCells.map(cell => cell.classList.contains('w7-cell--fallen') ? 1 : 0).join(',') !== INITIAL_BOARD.map(value => value ? 1 : 0).join(',')) errors.push('initial render orientation mismatch');
      const expectedInitialRotations = INITIAL_BOARD.map(value => `rotate(${orientationDegrees(value)})`);
      if (Array.from(renderProbe.querySelectorAll('.w7-daruma')).some((daruma, index) => daruma.getAttribute('transform') !== expectedInitialRotations[index])) errors.push('initial daruma rotation mismatch');
      renderBoard(SOLVED_BOARD, renderProbe);
      const solvedCells = Array.from(renderProbe.querySelectorAll('.w7-cell'));
      if (solvedCells.length !== CELL_COUNT || solvedCells.some(cell => !cell.classList.contains('w7-cell--standing'))) errors.push('solved render mismatch');
      if (Array.from(renderProbe.querySelectorAll('.w7-daruma')).some(daruma => daruma.getAttribute('transform') !== 'rotate(0)')) errors.push('solved daruma orientation mismatch');
      renderBoard(INITIAL_BOARD, renderProbe, { includeAxes:true });
      if (renderProbe.querySelectorAll('.w7-axis-grip').length !== TRIANGLES.length || renderProbe.querySelectorAll('.w7-axis-pivot').length !== TRIANGLES.length) errors.push('interactive axis render mismatch');
      const reducingMove = TRIANGLES.flatMap((_, triangleIndex) => [1, -1].map(direction => ({ triangleIndex, direction }))).find(move => selectDistance(WakeSevenBoardDomain.roll(INITIAL_BOARD, move.triangleIndex, move.direction)) === 0);
      if (!reducingMove) errors.push('reference stage has no solving move');
      else {
        const after = WakeSevenBoardDomain.roll(INITIAL_BOARD, reducingMove.triangleIndex, reducingMove.direction);
        const restored = WakeSevenBoardDomain.roll(after, reducingMove.triangleIndex, -reducingMove.direction);
        if (!WakeSevenBoardDomain.isSolved(after) || WakeSevenBoardDomain.encode(restored) !== REFERENCE_STAGE.state) errors.push('P2 commit/undo model mismatch');
      }
      if (selectDragDirection(17, 100, true) !== 0 || selectDragDirection(20, 200, true) !== 1 || selectDragDirection(-20, 200, true) !== -1 || selectDragDirection(20, 500, true) !== 0 || selectDragDirection(70) !== 1 || selectDragDirection(-70) !== -1) errors.push('drag threshold contract mismatch');
      if (!selectCanStartBoardDrag({ phase:BoardPhase.READY, cells:Uint8Array.from(INITIAL_BOARD) }) || selectCanStartBoardDrag({ phase:BoardPhase.ROTATING, cells:Uint8Array.from(INITIAL_BOARD) }) || selectCanStartBoardDrag({ phase:BoardPhase.READY, cells:Uint8Array.from(SOLVED_BOARD) })) errors.push('input gate contract mismatch');
      return Object.freeze({ passed:errors.length === 0, errors:Object.freeze(errors), stateCount:WakeSevenBoardDomain.stateCount, reachableCount:seen.size, distanceDistribution:Object.freeze(distribution), stageReferenceCount:1, symmetryCount:VIEW_SYMMETRIES.length, initialDistance, renderedInitialCells:initialCells.length, renderedSolvedCells:solvedCells.length, axisCount:TRIANGLES.length, p2ContractCount:4 });
    }
    /* WAKE7:JS:DEBUG-SELFTEST:END */

    /* WAKE7:JS:LIFECYCLE-BOOT:START */
    const selftestResult = runSelftest();
    if (!selftestResult.passed) throw new Error(`P2 board self-test failed: ${selftestResult.errors.slice(0, 3).join('; ')}`);
    boardElement.dataset.selftest = 'passed';
    boardElement.dataset.checkedStates = String(selftestResult.stateCount);
    boardElement.dataset.checkedAxes = String(selftestResult.axisCount);
    boardElement.dataset.checkedRenders = `${selftestResult.renderedInitialCells}+${selftestResult.renderedSolvedCells}`;
    boardElement.dataset.checkedP2Contracts = String(selftestResult.p2ContractCount);
    runArrivalEffect();
    /* WAKE7:JS:LIFECYCLE-BOOT:END */
    /* WAKE7:JS:FEATURE-BOARD:END */
  </script>
</body>
</html>
