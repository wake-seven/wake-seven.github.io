<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800,height=450">
<style>
*{box-sizing:border-box}html,body{margin:0;width:800px;height:450px;overflow:hidden;background:#16283c}
svg{display:block;width:800px;height:450px}
</style>
</head>
<body>
<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%"><stop stop-color="#213d5b"/><stop offset="1" stop-color="#16283c"/></radialGradient>
    <g id="daruma-body">
      <path d="M0-34C17-34 31-18 31 4C31 24 18 36 0 36C-18 36-31 24-31 4C-31-18-17-34 0-34Z" fill="#c8352c"/>
      <path d="M0-34C17-34 31-18 31 4C31 24 18 36 0 36C-18 36-31 24-31 4C-31-18-17-34 0-34Z" fill="none" stroke="#241d1a" stroke-width="2.4"/>
      <ellipse cy="-6" rx="19" ry="18" fill="#f3e8d5" stroke="#241d1a" stroke-width="1.9"/>
      <path d="M-15 22C-8 28 8 28 15 22" fill="none" stroke="#c9a54e" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g id="face-open">
      <path d="M-13-14C-11-17-6-17-4-14M4-14C6-17 11-17 13-14" fill="none" stroke="#241d1a" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="-8" cy="-5" r="3.7" fill="#241d1a"/><circle cx="8" cy="-5" r="3.7" fill="#241d1a"/>
      <circle cx="-9.2" cy="-6.2" r="1.2" fill="#f3e8d5"/><circle cx="6.8" cy="-6.2" r="1.2" fill="#f3e8d5"/>
      <circle cx="-15" cy="3" r="4.4" fill="#e2897b" opacity=".5"/><circle cx="15" cy="3" r="4.4" fill="#e2897b" opacity=".5"/>
      <path d="M-5 5C-3 8 3 8 5 5" fill="none" stroke="#241d1a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="face-shut">
      <path d="M-13-13C-11-15-6-15-4-13M4-13C6-15 11-15 13-13" fill="none" stroke="#241d1a" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>
      <path d="M-13-5C-11-1-5-1-3-5M3-5C5-1 11-1 13-5" fill="none" stroke="#241d1a" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="-15" cy="3" r="4.4" fill="#e2897b" opacity=".32"/><circle cx="15" cy="3" r="4.4" fill="#e2897b" opacity=".32"/>
      <ellipse cy="6" rx="3" ry="2.3" fill="#241d1a" opacity=".75"/>
    </g>
    <g id="face-happy">
      <path d="M-13-14C-11-17-6-17-4-14M4-14C6-17 11-17 13-14" fill="none" stroke="#241d1a" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M-13-4Q-8-11-3-4M3-4Q8-11 13-4" fill="none" stroke="#241d1a" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="-15" cy="3" r="4.4" fill="#e2897b" opacity=".5"/><circle cx="15" cy="3" r="4.4" fill="#e2897b" opacity=".5"/>
      <path d="M-5 5C-3 8 3 8 5 5" fill="none" stroke="#241d1a" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="tile-base"><path d="M0-54L46.765-27V27L0 54L-46.765 27V-27Z" fill="#f7eedc" stroke="#c0ac88" stroke-width="1.5"/></g>
    <g id="tile-fallen-base"><path d="M0-54L46.765-27V27L0 54L-46.765 27V-27Z" fill="#bccdd3" stroke="#9ea8af" stroke-width="1.5"/></g>
    <g id="tile-open"><use href="#tile-base"/><use href="#daruma-body"/><use href="#face-open"/></g>
    <g id="tile-shut"><use href="#tile-fallen-base"/><use href="#daruma-body"/><use href="#face-shut"/></g>
    <g id="tile-happy"><use href="#tile-base"/><use href="#daruma-body"/><use href="#face-happy"/></g>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="400" y="46" text-anchor="middle" fill="#f7eedc" font-family="A1 Gothic,Hiragino Kaku Gothic ProN,Yu Gothic,Noto Sans JP,sans-serif" font-size="27" font-weight="700">だるまさんを起こして！</text>
  <text x="400" y="74" text-anchor="middle" fill="#c9a54e" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing=".3em">WAKE SEVEN</text>
  <g id="board" transform="translate(240 83)">
    <g id="steady">
      <g id="cell2" transform="translate(66.77 155)"><use href="#tile-open"/></g>
      <g id="cell4" transform="translate(253.83 155)"><use href="#tile-open"/></g>
      <g id="cell5" transform="translate(113.54 236)"><use href="#tile-open"/></g>
      <g id="cell6" transform="translate(207.06 236)"><use href="#tile-open"/></g>
    </g>
    <g id="turning">
      <g transform="translate(113.54 74) rotate(120)"><use href="#tile-shut"/></g>
      <g transform="translate(207.06 74) rotate(120)"><use href="#tile-shut"/></g>
      <g transform="translate(160.30 155) rotate(120)"><use href="#tile-shut"/></g>
    </g>
    <g id="finished" opacity="0">
      <g transform="translate(113.54 74)"><use href="#tile-happy"/></g>
      <g transform="translate(207.06 74)"><use href="#tile-happy"/></g>
      <g transform="translate(66.77 155)"><use href="#tile-happy"/></g>
      <g transform="translate(160.30 155)"><use href="#tile-happy"/></g>
      <g transform="translate(253.83 155)"><use href="#tile-happy"/></g>
      <g transform="translate(113.54 236)"><use href="#tile-happy"/></g>
      <g transform="translate(207.06 236)"><use href="#tile-happy"/></g>
    </g>
    <g id="hint" fill="none" stroke-linecap="round">
      <g stroke="#c9a54e" stroke-width="7">
        <path d="M202 52C186 28 151 23 124 40"/>
        <path d="M124 40L138 37M124 40L129 26"/>
      </g>
    </g>
    <g id="burst" opacity="0" fill="none" stroke-linecap="round"><circle cx="160.3" cy="155" r="105" stroke="#c9a54e" stroke-width="4"/><circle cx="160.3" cy="155" r="122" stroke="#f7eedc" stroke-width="2" opacity=".7"/></g>
  </g>
  <text id="caption" x="400" y="420" text-anchor="middle" fill="#b9e8f2" font-family="A1 Gothic,Hiragino Kaku Gothic ProN,Yu Gothic,Noto Sans JP,sans-serif" font-size="23" font-weight="700">3体をくるりと回して</text>
</svg>
<script>
const frame=Math.max(0,Math.min(59,Number(new URLSearchParams(location.search).get('frame'))||0));
const turning=document.getElementById('turning'),finished=document.getElementById('finished');
const steady=document.getElementById('steady'),hint=document.getElementById('hint'),burst=document.getElementById('burst'),caption=document.getElementById('caption');
const ease=value=>1-Math.pow(1-value,3);
if(frame<14){
  hint.style.opacity=String(.55+.3*Math.sin(frame/13*Math.PI));
}else if(frame<34){
  const progress=ease((frame-14)/19),angle=-120*progress;
  turning.setAttribute('transform','rotate('+angle+' 160.30 101)');
  hint.style.opacity=String(Math.max(0,1-progress*2));
}else{
  turning.style.opacity='0';steady.style.opacity='0';finished.style.opacity='1';hint.style.opacity='0';
  const progress=Math.min(1,(frame-34)/8);
  burst.style.opacity=String(1-progress);
  burst.setAttribute('transform','translate(160.3 155) scale('+(0.55+progress*.85)+') translate(-160.3 -155)');
  caption.textContent='全員起きました！';caption.setAttribute('fill','#c9a54e');
}
</script>
</body>
</html>
