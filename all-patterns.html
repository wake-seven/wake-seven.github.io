<script>
const N=7,P=[1,3,9,27,81,243,729],NS=2187;
const C=[[.5,0],[1.5,0],[0,1],[1,1],[2,1],[.5,2],[1.5,2]].map(([x,y])=>({x:x*Math.sqrt(3),y:y*1.5}));
const enc=a=>a.reduce((n,v,i)=>n+v*P[i],0),dec=n=>Uint8Array.from({length:N},(_,i)=>{const v=n%3;n=(n/3)|0;return v});
const near=(a,b)=>Math.abs(Math.hypot(C[a].x-C[b].x,C[a].y-C[b].y)-Math.sqrt(3))<.01;
const TRI=[];for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)for(let c=b+1;c<N;c++)if(near(a,b)&&near(a,c)&&near(b,c)){const cx=(C[a].x+C[b].x+C[c].x)/3,cy=(C[a].y+C[b].y+C[c].y)/3;TRI.push([a,b,c].sort((i,j)=>Math.atan2(C[i].y-cy,C[i].x-cx)-Math.atan2(C[j].y-cy,C[j].x-cx)));}
const roll=(a,t,d)=>{const b=Uint8Array.from(a);t.forEach((to,i)=>{const from=d>0?t[(i+2)%3]:t[(i+1)%3];b[to]=(a[from]+(d>0?1:2))%3});return b};
const dist=new Uint8Array(NS).fill(255),by=[[]];dist[0]=0;by[0]=[0];for(let depth=0;by[depth]?.length;depth++){const next=[];for(const s of by[depth])for(const t of TRI)for(const d of [1,-1]){const x=enc(roll(dec(s),t,d));if(dist[x]===255){dist[x]=depth+1;next.push(x)}}if(next.length)by.push(next)}
function perm(deg=0,flip=false){const q=deg*Math.PI/180,co=Math.cos(q),si=Math.sin(q),o=C[3];return C.map(p=>{let x=p.x-o.x,y=p.y-o.y;if(flip)x=-x;let best=0,bd=1e9;C.forEach((v,i)=>{const z=Math.hypot(x*co-y*si-(v.x-o.x),x*si+y*co-(v.y-o.y));if(z<bd){bd=z;best=i}});return best})}
const SYM=[0,60,120,180,240,300].flatMap(a=>[{p:perm(a),f:false},{p:perm(a,true),f:true}]);
function transform(s,x){const a=dec(s),b=new Uint8Array(N);a.forEach((v,i)=>b[x.p[i]]=x.f?(3-v)%3:v);return enc(b)}function canon(s){return Math.min(...SYM.map(x=>transform(s,x)))}
const maskOf=indices=>indices.reduce((mask,i)=>mask|(1<<i),0);
const maskOrbit=indices=>new Set(SYM.map(symmetry=>maskOf(indices.map(i=>symmetry.p[i]))));
const canonicalMask=mask=>Math.min(...SYM.map(symmetry=>symmetry.p.reduce((value,to,from)=>value|(((mask>>from)&1)<<to),0)));
const SHAPE_MASKS={
  diamond:maskOrbit([0,1,2,3]),
  caterpillar:maskOrbit([0,1,3,5]),
  ribbon:maskOrbit([0,1,3,5,6]),
  trapezoid:maskOrbit([0,1,2,3,5]),
  largeTriangle:maskOrbit([0,4,5]),
  bowArrow:maskOrbit([0,2,3,4,5]),
  ichimonji:maskOrbit([2,3,4]),
  outerAdjacent:maskOrbit([0,1]),
  dish:maskOrbit([0,1,2]),
  smallTriangle:maskOrbit([0,1,3]),
  necklace:maskOrbit([1,2,3]),
  crown:maskOrbit([0,1,2,4]),
  bay:maskOrbit([0,1,2,4,5]),
  turtleShell:maskOrbit([0,1,2,3,4,5]),
  sleepQuiet:maskOrbit([0,1,2,3,4,5,6]),
  reverseCaterpillar:maskOrbit([0,2,4]),
  reverseNecklace:maskOrbit([0,1,4,5]),
  reverseIchimonji:maskOrbit([1,2,4,5]),
  reverseBay:maskOrbit([0,3]),
  reverseBowArrow:maskOrbit([1,2]),
  reverseRibbon:maskOrbit([2,4]),
  ring:maskOrbit([0,1,2,4,5,6])
};
const sleepingMask=state=>maskOf([...dec(state)].flatMap((value,index)=>value?[index]:[]));
const standingMask=state=>maskOf([...dec(state)].flatMap((value,index)=>value?[]:[index]));
function matchesShape(state,shape){

  return SHAPE_MASKS[shape].has(sleepingMask(state));
}
const groups={1:[],2:[],3:[],4:[]};for(let s=0;s<NS;s++)if(dist[s]>=1&&dist[s]<=4&&canon(s)===s)groups[dist[s]].push(s);
const labels={1:'最短1手',2:'最短2手',3:'最短3手',4:'最短4手'};let filter=0,fallenFilter=-1,shapeFilter='all';
function board(s,big=false){const a=dec(s),r=big?27:14,pts=(x,y)=>[[-r,0],[-r/2,-r*.86],[r/2,-r*.86],[r,0],[r/2,r*.86],[-r/2,r*.86]].map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');return '<svg viewBox="0 0 184 '+(big?178:105)+'" aria-hidden="true">'+C.map((p,i)=>{const x=(big?47:43)+p.x*(big?26:20),y=(big?40:10)+p.y*(big?26:20),v=a[i],ang=v*120;return '<g transform="translate('+x+' '+y+') rotate('+ang+')"><polygon points="'+pts(x,y)+'" fill="'+(v?'#b9c6d6':'#f3e8d5')+'" stroke="'+(v?'#718297':'#c9a54e')+'" stroke-width="'+(big?1.8:1)+'"/><path d="M0 -'+(r*.62)+'C'+(r*.32)+' -'+(r*.62)+' '+(r*.57)+' -'+(r*.33)+' '+(r*.57)+' '+(r*.08)+'C'+(r*.57)+' '+(r*.45)+' '+(r*.33)+' '+(r*.66)+' 0 '+(r*.66)+'C-'+(r*.33)+' '+(r*.66)+' -'+(r*.57)+' '+(r*.45)+' -'+(r*.57)+' '+(r*.08)+'C-'+(r*.57)+' -'+(r*.33)+' -'+(r*.32)+' -'+(r*.62)+' 0 -'+(r*.62)+'Z" fill="#c8352c" stroke="#241d1a" stroke-width="'+(big?1.3:.7)+'"/><ellipse cy="-'+(r*.1)+'" rx="'+(r*.35)+'" ry="'+(r*.31)+'" fill="#f7eedc" stroke="#241d1a" stroke-width="'+(big?1:.5)+'"/>'+(v?'<path d="M-'+(r*.22)+' -'+(r*.1)+'q'+(r*.1)+' '+(r*.12)+' '+(r*.2)+' 0m'+(r*.14)+' 0q'+(r*.1)+' '+(r*.12)+' '+(r*.2)+' 0" fill="none" stroke="#241d1a" stroke-width="'+(big?1.4:.7)+'"/>':'<circle cx="-'+(r*.14)+'" cy="-'+(r*.08)+'" r="'+(r*.07)+'"/><circle cx="'+(r*.14)+'" cy="-'+(r*.08)+'" r="'+(r*.07)+'"/>')+'</g>'}).join('')+'</svg>'}
function render(){const matches=s=>(fallenFilter<0||dec(s).filter(v=>v>0).length===fallenFilter)&&matchesShape(s,shapeFilter),matchGroup=n=>groups[n].filter(matches),summary=document.querySelector('#summary');summary.innerHTML=[0,1,2,3,4].map(n=>{const count=n?matchGroup(n).length:[1,2,3,4].reduce((sum,d)=>sum+matchGroup(d).length,0);return '<button class="'+(filter===n?'active':'')+'" data-f="'+n+'">'+(n?'最短'+n+'手':'すべて')+'<b>'+count+'</b></button>'}).join('');summary.onclick=e=>{const b=e.target.closest('button');if(b){filter=+b.dataset.f;render()}};const shown=filter?[filter]:[1,2,3,4];document.querySelector('#content').innerHTML=shown.map(n=>{const states=matchGroup(n);return states.length?'<section><div class="section"><h2>'+labels[n]+'</h2><span>'+states.length+'パターン</span></div><div class="grid">'+states.map(s=>'<button class="card" data-s="'+s+'" data-d="'+n+'">'+board(s)+'<small><b>'+labels[n]+'</b> · '+(groups[n].indexOf(s)+1)+' / '+groups[n].length+'</small></button>').join('')+'</div></section>':''}).join('')||'<p class="empty">該当する盤面はありません。</p>';document.querySelector('#content').onclick=e=>{const b=e.target.closest('.card');if(!b)return;const s=+b.dataset.s,d=+b.dataset.d,i=groups[d].indexOf(s)+1;document.querySelector('#modalTitle').textContent=labels[d]+' · '+i+' / '+groups[d].length;document.querySelector('#modalBoard').innerHTML=board(s,true);document.querySelector('#modalText').textContent='回転・左右反転で同じになる盤面は、ひとつのパターンとして数えています。';document.querySelector('#modal').hidden=false}};document.querySelector('#modalClose').onclick=()=>document.querySelector('#modal').hidden=true;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.hidden=true};render();
</script>
<script>
const genomeModalPos=i=>({x:78+C[i].x*54,y:62+C[i].y*54});
const genomeEase=t=>1-Math.pow(1-t,3);
const genomeShortestAngle=(from,to)=>{
  let delta=(to-from+540)%360-180;
  return from+delta;
};
function animateGenomeModal(symmetry){
  if(document.querySelector('#modal').dataset.animating)return;
  const before=genomeModalState,after=transform(before,symmetry),a=dec(before),b=dec(after),duration=520;
  const modal=document.querySelector('#modal'),tiles=[...document.querySelectorAll('#modalBoard .genome-tile')];
  modal.dataset.animating='1';
  tiles.forEach(tile=>{
    const from=+tile.dataset.cell,p=genomeModalPos(from);
    tile.setAttribute('transform','translate('+p.x+' '+p.y+')');
    tile.querySelector('.genome-daruma').setAttribute('transform','rotate('+genomeAngle(a[from])+') scale(.95)');
  });
  let start;
  const frame=now=>{
    const progress=Math.min(1,(now-start)/duration),t=genomeEase(progress);
    tiles.forEach(tile=>{
      const from=+tile.dataset.cell,to=symmetry.p[from],p=genomeModalPos(from),q=genomeModalPos(to);
      tile.setAttribute('transform','translate('+(p.x+(q.x-p.x)*t)+' '+(p.y+(q.y-p.y)*t)+')');
      const daruma=tile.querySelector('.genome-daruma');
      const angle=genomeShortestAngle(genomeAngle(a[from]),genomeAngle(b[to]));
      daruma.setAttribute('transform','rotate('+(genomeAngle(a[from])+(angle-genomeAngle(a[from]))*t)+') scale(.95)');
    });
    if(progress<1)requestAnimationFrame(frame);
    else { delete modal.dataset.animating;genomeOpenModal(after,genomeModalDepth); }
  };
  requestAnimationFrame(()=>requestAnimationFrame(now=>{start=now;frame(now)}));
}
document.querySelector('#modal').addEventListener('click',event=>{
  const button=event.target.closest('[data-modal-transform]');
  if(!button)return;
  event.stopImmediatePropagation();
  animateGenomeModal(button.dataset.modalTransform==='mirror'?SYM[1]:SYM[2]);
},true);
</script>

function enhanceGenomeCards(){document.querySelectorAll('#content .card').forEach(old=>{const card=document.createElement('article'),open=document.createElement('button'),tools=document.createElement('div');card.className='card';card.dataset.s=old.dataset.s;card.dataset.d=old.dataset.d;open.className='card-open';open.type='button';open.innerHTML=old.innerHTML;tools.className='card-tools';tools.innerHTML='<button type="button" data-transform="mirror" aria-label="左右反転">↔</button><button type="button" data-transform="rotate" aria-label="60度回転">↻</button>';card.append(tools,open);old.replaceWith(card)})}
render=()=>{baseRender();enhanceGenomeCards()};render();
document.querySelector('#content').onclick=e=>{const card=e.target.closest('.card');if(!card)return;const tool=e.target.closest('[data-transform]');if(tool){const symmetry=tool.dataset.transform==='mirror'?SYM[1]:SYM[2],next=transform(+card.dataset.s,symmetry);card.dataset.s=next;const d=+card.dataset.d,i=groups[d].indexOf(next)+1;card.querySelector('.card-open').innerHTML=board(next)+'<small><b>'+labels[d]+'</b> · '+(i>0?i:'表示中')+' / '+groups[d].length+'</small>';return}if(!e.target.closest('.card-open'))return;const s=+card.dataset.s,d=+card.dataset.d,i=groups[d].indexOf(s)+1;document.querySelector('#modalTitle').textContent=labels[d]+' · '+(i>0?i:'表示中')+' / '+groups[d].length;document.querySelector('#modalBoard').innerHTML=board(s,true);document.querySelector('#modalText').textContent='回転・左右反転で同じになる盤面は、ひとつのパターンとして数えています。';document.querySelector('#modal').hidden=false};
</script>
<script>
function board(s,big=false){const a=dec(s),r=big?27:14,pts=[[0,-r],[r*.866,-r*.5],[r*.866,r*.5],[0,r],[-r*.866,r*.5],[-r*.866,-r*.5]].map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' '),scale=big?.52:.28;return '<svg viewBox="0 0 184 '+(big?178:105)+'" aria-hidden="true">'+C.map((p,i)=>{const x=43+p.x*20,y=10+p.y*20,v=a[i],angle=v===2?-120:v*120;return '<g class="genome-tile" data-cell="'+i+'" transform="translate('+x+' '+y+')"><polygon points="'+pts+'" fill="'+(v?'#B9C6D6':'#F3E8D5')+'" stroke="'+(v?'#718297':'#C9A54E')+'" stroke-width="1"/><g class="genome-daruma" transform="rotate('+angle+') scale('+scale+')"><use href="#genome-body"/><use href="#'+(v?'genome-shut':'genome-open')+'"/></g></g>'}).join('')+'</svg>'}
function board(s,big=false){const a=dec(s),r=big?27:14,pts=[[0,-r],[r*.866,-r*.5],[r*.866,r*.5],[0,r],[-r*.866,r*.5],[-r*.866,-r*.5]].map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' '),scale=big?.52:.28,ox=big?47:43,oy=big?40:24,step=big?26:20;return '<svg viewBox="0 0 184 '+(big?178:105)+'" aria-hidden="true">'+C.map((p,i)=>{const x=ox+p.x*step,y=oy+p.y*step,v=a[i],angle=v===2?-120:v*120;return '<g class="genome-tile" data-cell="'+i+'" transform="translate('+x+' '+y+')"><polygon points="'+pts+'" fill="'+(v?'#B9C6D6':'#F3E8D5')+'" stroke="'+(v?'#718297':'#C9A54E')+'" stroke-width="'+(big?1.8:1)+'"/><g class="genome-daruma" transform="rotate('+angle+') scale('+scale+')"><use href="#genome-body"/><use href="#'+(v?'genome-shut':'genome-open')+'"/></g></g>'}).join('')+'</svg>'}
function board(s,big=false){const a=dec(s),r=big?54:48,w=big?330:300,h=big?300:270,pts=[[0,-r],[r*.866,-r*.5],[r*.866,r*.5],[0,r],[-r*.866,r*.5],[-r*.866,-r*.5]].map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' '),scale=big?.95:.88,ox=big?78:70,oy=big?62:55;return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+C.map((p,i)=>{const x=ox+p.x*r,y=oy+p.y*r,v=a[i],angle=v===2?-120:v*120;return '<g class="genome-tile" data-cell="'+i+'" transform="translate('+x+' '+y+')"><polygon points="'+pts+'" fill="'+(v?'#B9C6D6':'#F3E8D5')+'" stroke="'+(v?'#718297':'#C9A54E')+'" stroke-width="'+(big?2.1:1.7)+'"/><g class="genome-daruma" transform="rotate('+angle+') scale('+scale+')"><use href="#genome-body"/><use href="#'+(v?'genome-shut':'genome-open')+'"/></g></g>'}).join('')+'</svg>'}
let genomeModalState=0,genomeModalDepth=1;
function genomeOpenModal(state,depth){genomeModalState=state;genomeModalDepth=depth;const i=groups[depth].indexOf(canon(state))+1;document.querySelector('#modalTitle').textContent=labels[depth]+' · '+i+' / '+groups[depth].length;document.querySelector('#modalBoard').innerHTML=board(state,true);document.querySelector('#modalText').textContent='';document.querySelector('#modal').hidden=false}
const genomeContent=document.querySelector('#content');
const genomePos=i=>({x:70+C[i].x*48,y:55+C[i].y*48});
document.querySelectorAll('[data-modal-transform]').forEach(button=>button.addEventListener('click',()=>genomeOpenModal(transform(genomeModalState,button.dataset.modalTransform==='mirror'?SYM[1]:SYM[2]),genomeModalDepth)));
genomeContent.addEventListener('click',event=>{const card=event.target.closest('.card');if(!card)return;event.stopImmediatePropagation();const tool=event.target.closest('[data-transform]');if(tool){animateGenomeCard(card,tool.dataset.transform==='mirror'?SYM[1]:SYM[2]);return}if(event.target.closest('.card-open'))genomeOpenModal(+card.dataset.s,+card.dataset.d)},true);
const genomeAngle=v=>v===2?-120:v*120;
function updateGenomeCard(card,state){card.dataset.s=state;const d=+card.dataset.d,i=groups[d].indexOf(canon(state))+1;card.querySelector('.card-open').innerHTML=board(state)+'<small><b>'+labels[d]+'</b> · '+i+' / '+groups[d].length+'</small>'}
function animateGenomeCard(card,symmetry){if(card.dataset.animating)return;card.dataset.animating='1';const before=+card.dataset.s,after=transform(before,symmetry),a=dec(before),b=dec(after),duration=480;card.querySelectorAll('.genome-tile').forEach(tile=>{const from=+tile.dataset.cell,to=symmetry.p[from],p=genomePos(from),q=genomePos(to);tile.animate([{transform:'translate('+p.x+'px,'+p.y+'px)'},{transform:'translate('+q.x+'px,'+p.y+'px)'},{transform:'translate('+q.x+'px,'+q.y+'px)'}],{duration,easing:'cubic-bezier(.2,.8,.25,1)'});const daruma=tile.querySelector('.genome-daruma');daruma.animate([{transform:'rotate('+genomeAngle(a[from])+'deg) scale(.73)'},{transform:'rotate('+genomeAngle(b[to])+'deg) scale(.73)'}],{duration,easing:'cubic-bezier(.2,.8,.25,1)'});});setTimeout(()=>{updateGenomeCard(card,after);delete card.dataset.animating},duration)}
genomeContent.onclick=e=>{const card=e.target.closest('.card');if(!card)return;const tool=e.target.closest('[data-transform]');if(tool){animateGenomeCard(card,tool.dataset.transform==='mirror'?SYM[1]:SYM[2]);return}if(!e.target.closest('.card-open'))return;const s=+card.dataset.s,d=+card.dataset.d,i=groups[d].indexOf(s)+1;document.querySelector('#modalTitle').textContent=labels[d]+' · '+(i>0?i:'表示中')+' / '+groups[d].length;document.querySelector('#modalBoard').innerHTML=board(s,true);document.querySelector('#modalText').textContent='回転・左右反転で同じになる盤面は、ひとつのパターンとして数えています。';document.querySelector('#modal').hidden=false};render();
</script>
<script>
function animateGenomeCard(card,symmetry){
  if(card.dataset.animating)return;
  card.dataset.animating='1';
  const before=+card.dataset.s,after=transform(before,symmetry),a=dec(before),b=dec(after),duration=520;
  const tiles=[...card.querySelectorAll('.genome-tile')];
  tiles.forEach(tile=>{
    const from=+tile.dataset.cell,p=genomePos(from);
    tile.setAttribute('transform','translate('+p.x+' '+p.y+')');
    tile.querySelector('.genome-daruma').setAttribute('transform','rotate('+genomeAngle(a[from])+') scale(.88)');
  });
  let start;
  const frame=now=>{
    const progress=Math.min(1,(now-start)/duration),t=genomeEase(progress);
    tiles.forEach(tile=>{
      const from=+tile.dataset.cell,to=symmetry.p[from],p=genomePos(from),q=genomePos(to);
      tile.setAttribute('transform','translate('+(p.x+(q.x-p.x)*t)+' '+(p.y+(q.y-p.y)*t)+')');
      const daruma=tile.querySelector('.genome-daruma');
      const angle=genomeShortestAngle(genomeAngle(a[from]),genomeAngle(b[to]));
      daruma.setAttribute('transform','rotate('+(genomeAngle(a[from])+(angle-genomeAngle(a[from]))*t)+') scale(.88)');
    });
    if(progress<1)requestAnimationFrame(frame);
    else { updateGenomeCard(card,after);delete card.dataset.animating; }
  };
  requestAnimationFrame(()=>requestAnimationFrame(now=>{start=now;frame(now)}));
}
</script>
<script>
const genomeSizeControl=document.querySelector('#boardSize');
function setGenomeBoardSize(size){
  document.documentElement.dataset.boardSize=size;
  genomeSizeControl.querySelectorAll('button').forEach(button=>button.classList.toggle('active',button.dataset.size===size));
  try{localStorage.setItem('wakeSevenGenomeBoardSize',size)}catch(_e){}
}
let genomeBoardSize='normal';
try{genomeBoardSize=localStorage.getItem('wakeSevenGenomeBoardSize')||genomeBoardSize}catch(_e){}
setGenomeBoardSize(['small','normal','large'].includes(genomeBoardSize)?genomeBoardSize:'normal');
genomeSizeControl.addEventListener('click',event=>{
  const button=event.target.closest('[data-size]');
  if(button)setGenomeBoardSize(button.dataset.size);
});
const fallenFilterControl=document.querySelector('#fallenFilter');
function setFallenFilter(value){
  fallenFilter=value;
  fallenFilterControl.querySelectorAll('button').forEach(button=>button.classList.toggle('active',+button.dataset.fallen===value));
  render();
}
setFallenFilter(-1);
fallenFilterControl.addEventListener('click',event=>{
  const button=event.target.closest('[data-fallen]');
  if(button)setFallenFilter(+button.dataset.fallen);
});
const shapeFilterControl=document.querySelector('#shapeCatalog');
function setShapeFilter(shape){
  shapeFilter=shape;
  shapeFilterControl.querySelectorAll('button').forEach(button=>button.classList.toggle('active',button.dataset.shape===shape));
  render();
}
setShapeFilter('all');
shapeFilterControl.addEventListener('click',event=>{
  const button=event.target.closest('[data-shape]');
  if(button)setShapeFilter(button.dataset.shape);
});
</script>
<script>
const SHAPE_CATALOG=[
  ['outerAdjacent',3,'外隣り'],['reverseBowArrow',6,'逆弓矢'],['reverseBay',9,'逆湾'],['reverseRibbon',20,'逆リボン'],
  ['dish',7,'お皿'],['smallTriangle',11,'小三角'],['necklace',14,'ネックレス'],['reverseCaterpillar',21,'逆芋虫'],['ichimonji',28,'一文字'],['largeTriangle',49,'大三角'],
  ['diamond',15,'ひし形'],['crown',23,'王冠'],['caterpillar',29,'芋虫'],['reverseNecklace',51,'逆ネックレス'],['reverseIchimonji',54,'逆一文字'],['shuriken',57,'手裏剣'],
  ['trapezoid',31,'台形'],['bay',55,'湾'],['bowArrow',59,'弓矢'],['ribbon',62,'リボン'],
  ['turtleShell',63,'こうら'],['ring',119,'輪'],['sleepQuiet',127,'寝静まり']
];
const shapeCount=mask=>mask.toString(2).split('1').length-1;
const catalogStates=Object.values(groups).flat();
const catalogBuckets={1:[],2:[],3:[],4:[],mixed34:[]};
SHAPE_CATALOG.forEach(([key,mask,name])=>{
  const states=catalogStates.filter(candidate=>canonicalMask(sleepingMask(candidate))===mask);
  const moves=[...new Set(states.map(state=>dist[state]))];
  const bucket=key==='smallTriangle'||(moves.length===1&&moves[0]===1)?1:moves.includes(2)?2:moves.length===1&&[3,4].includes(moves[0])?moves[0]:'mixed34';
  catalogBuckets[bucket].push({key,mask,name,state:states[0]});
});
const catalogLabels={1:'最短1手',2:'最短2手あり（混在）',3:'最短3手',4:'最短4手',mixed34:'最短3手・4手（混在）'};
const catalogSection=bucket=>'<section class="shape-catalog-group"><h3>'+catalogLabels[bucket]+'</h3><div class="shape-catalog-row">'+catalogBuckets[bucket].map(item=>
  '<button type="button" class="catalog-card" data-shape="'+item.key+'">'+board(item.state)+'<b>'+item.name+'</b><small>寝 '+shapeCount(item.mask)+'体</small></button>'
).join('')+'</div></section>';
document.querySelector('#shapeCatalog').innerHTML='<div class="catalog-reset"><button type="button" data-shape="all">すべて表示</button></div>'+
  [1,2,3,'mixed34',4].map(catalogSection).join('');
setShapeFilter(shapeFilter);
</script>
