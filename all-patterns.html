    tile.querySelector('.genome-daruma').setAttribute('transform','rotate('+genomeAngle(a[from])+') scale(.95)');

<script>
function animateGenomeCard(card,symmetry){
  if(card.dataset.animating)return;
  card.dataset.animating='1';
  const before=+card.dataset.s,after=transform(before,symmetry),a=dec(before),b=dec(after),duration=520;
  const tiles=[...card.querySelectorAll('.genome-tile')];
  tiles.forEach(tile=>{
    const from=+tile.dataset.cell,p=genomePos(from);
    tile.setAttribute('transform','translate('+p.x+' '+p.y+')');
    tile.querySelector('.genome-daruma').setAttribute('transform','rotate('+genomeAngle(a[from])+') scale(.88)');
  });
  let start;
  const frame=now=>{
    const progress=Math.min(1,(now-start)/duration),t=genomeEase(progress);
    tiles.forEach(tile=>{
      const from=+tile.dataset.cell,to=symmetry.p[from],p=genomePos(from),q=genomePos(to);
      tile.setAttribute('transform','translate('+(p.x+(q.x-p.x)*t)+' '+(p.y+(q.y-p.y)*t)+')');
      const daruma=tile.querySelector('.genome-daruma');
      const angle=genomeShortestAngle(genomeAngle(a[from]),genomeAngle(b[to]));
      daruma.setAttribute('transform','rotate('+(genomeAngle(a[from])+(angle-genomeAngle(a[from]))*t)+') scale(.88)');
    });
    if(progress<1)requestAnimationFrame(frame);
    else { updateGenomeCard(card,after);delete card.dataset.animating; }
  };
  requestAnimationFrame(()=>requestAnimationFrame(now=>{start=now;frame(now)}));
}
</script>

<script>
const SHAPE_CATALOG=[
  ['outerAdjacent',3,'外隣り'],['reverseBowArrow',6,'逆弓矢'],['reverseBay',9,'カギ'],['reverseRibbon',20,'逆リボン'],
  ['dish',7,'お皿'],['smallTriangle',11,'小三角'],['necklace',14,'ネックレス'],['reverseCaterpillar',21,'直角三角形'],['ichimonji',28,'一文字'],['largeTriangle',49,'大三角'],
  ['diamond',15,'ひし形'],['crown',23,'王冠'],['caterpillar',29,'芋虫'],['reverseNecklace',51,'気球'],['reverseIchimonji',54,'長方形'],['shuriken',57,'手裏剣'],
  ['trapezoid',31,'台形'],['bay',55,'ひづめ'],['bowArrow',59,'弓矢'],['ribbon',62,'リボン'],
  ['turtleShell',63,'お皿二枚'],['ring',119,'輪'],['sleepQuiet',127,'寝静まり']
];
const shapeCount=mask=>mask.toString(2).split('1').length-1;
const catalogStates=Object.values(groups).flat();
const catalogBuckets={1:[],2:[],3:[],4:[],mixed34:[]};
SHAPE_CATALOG.forEach(([key,mask,name])=>{
  const states=catalogStates.filter(candidate=>canonicalMask(sleepingMask(candidate))===mask);
  const moves=[...new Set(states.map(state=>dist[state]))];
  const bucket=key==='smallTriangle'||(moves.length===1&&moves[0]===1)?1:moves.includes(2)?2:moves.length===1&&[3,4].includes(moves[0])?moves[0]:'mixed34';
  catalogBuckets[bucket].push({key,mask,name,state:states[0]});
});
const catalogLabels={...gt('catalogLabels')};
const catalogCard=item=>'<button type="button" class="catalog-card" data-shape="'+item.key+'" data-shape-name="'+item.key+'">'+board(item.state)+'<b>'+item.name+'</b><small>'+gt('sleep')+' '+shapeCount(item.mask)+'</small></button>';
const catalogSection=bucket=>'<section class="shape-catalog-group"><h3 data-catalog-bucket="'+bucket+'">'+catalogLabels[bucket]+'</h3><div class="shape-catalog-row">'+catalogBuckets[bucket].map(catalogCard).join('')+'</div></section>';
const topCatalogSection='<section class="shape-catalog-group top-catalog"><h3 data-catalog-bucket="1">'+catalogLabels[1]+'</h3><h3 data-catalog-bucket="4">'+catalogLabels[4]+'</h3><div class="top-catalog-cards">'+catalogBuckets[1].map(catalogCard).join('')+catalogBuckets[4].map(catalogCard).join('')+'</div></section>';
document.querySelector('#shapeCatalog').innerHTML='<div class="catalog-reset"><button type="button" data-shape="all">'+gt('all')+'</button></div>'+
  topCatalogSection+[2,3,'mixed34'].map(catalogSection).join('');
setShapeFilter(shapeFilter);
</script>
<script>
function applyGenomeLanguage(){
  const text=GENOME_I18N[genomeLang];
  document.documentElement.lang=genomeLang;
  document.title=text.title;
  document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=gt(node.dataset.i18n));
  document.querySelector('#languageToggle').setAttribute('aria-label',gt('language'));
  document.querySelector('#boardSize').setAttribute('aria-label',gt('size'));
  document.querySelector('#fallenFilter').setAttribute('aria-label',gt('asleep'));
  document.querySelectorAll('[data-modal-transform]').forEach(button=>button.setAttribute('aria-label',gt(button.dataset.modalTransform==='mirror'?'mirror':'rotate')));
  Object.assign(labels,text.moveLabels);
  const fallen=document.querySelector('#fallenFilter');
  fallen.innerHTML=[2,3,4,5,6,7].map(n=>'<button type="button" data-fallen="'+n+'">'+gt('sleep')+n+'</button>').join('');
  document.querySelectorAll('[data-catalog-bucket]').forEach(node=>node.textContent=text.catalogLabels[node.dataset.catalogBucket]);
  document.querySelectorAll('[data-shape-name]').forEach(node=>{
    node.querySelector('b').textContent=text.shapes[node.dataset.shapeName];
    const shape=SHAPE_CATALOG.find(item=>item[0]===node.dataset.shapeName);
    node.querySelector('small').textContent=gt('sleep')+' '+shapeCount(shape[1]);
  });
  document.querySelector('#shapeCatalog [data-shape="all"]').textContent=gt('all');
  document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-checked',String(button.dataset.lang===genomeLang)));
  setFallenFilter(fallenFilter);
  setShapeFilter(shapeFilter);
  render();
}
function setGenomeLanguage(lang){
  if(!GENOME_I18N[lang])return;
  genomeLang=lang;
  try{localStorage.setItem('wake7-language',lang)}catch(_e){}
  applyGenomeLanguage();
}
const genomeLanguageMenu=document.querySelector('#languageMenu');
const filterSidebar=document.querySelector('#filterSidebar');
const genomePageLayout=document.querySelector('.page-layout');
document.querySelector('#filterSidebarToggle').addEventListener('click',()=>{
  if(matchMedia('(min-width:641px)').matches){
    const collapsed=filterSidebar.classList.toggle('collapsed');
    genomePageLayout.classList.toggle('filters-collapsed',collapsed);
  }else filterSidebar.classList.toggle('open');
});
document.querySelector('#languageToggle').addEventListener('click',()=>{
  const open=!genomeLanguageMenu.classList.contains('show');
  genomeLanguageMenu.classList.toggle('show',open);
  document.querySelector('#languageToggle').setAttribute('aria-expanded',String(open));
});
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{
  setGenomeLanguage(button.dataset.lang);
  genomeLanguageMenu.classList.remove('show');
  document.querySelector('#languageToggle').setAttribute('aria-expanded','false');
}));
document.addEventListener('click',event=>{if(!event.target.closest('.language-picker')){genomeLanguageMenu.classList.remove('show');document.querySelector('#languageToggle').setAttribute('aria-expanded','false')}});
applyGenomeLanguage();
</script>
